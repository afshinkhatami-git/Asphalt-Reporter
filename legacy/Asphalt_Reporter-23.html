/* دکمه شروع گزارش جدید؛ در حالت فعال باید کاملاً برجسته و قابل تشخیص باشد */
.btn-new-report{display:inline-flex;align-items:center;justify-content:center;font-family:inherit;cursor:pointer;border-radius:8px;padding:11px 22px;font-size:13.5px;font-weight:700;line-height:1.2;transition:.15s;background:#176b55;color:#fff;border:1.5px solid #125642;box-shadow:0 2px 5px rgba(18,86,66,.18)}
.btn-new-report:hover:not(:disabled){background:#105640;transform:translateY(-1px)}
.btn-new-report:disabled{background:#e6e9e7;color:#9aa6a1;border-color:#d6ddda;box-shadow:none;cursor:not-allowed;opacity:1}
body[data-theme="dark"] .btn-new-report:disabled{background:#34434a;color:#71818a;border-color:#43535a}


</style>
<style>
:root{
  --bg:#f4efd8;
  --paper:#ffffff;
  --ink:#232323;
  --ink-soft:#5b5f66;
  --line:#e3e1db;
  --charcoal:#2b2e33;
  --amber:#a86a2e;
  --amber-soft:#f3e6d6;
  --blue:#2f5d82;
  --blue-soft:#e8eff4;
  --ok:#3a7d55;
  --err:#b8452f;
  --radius:10px;
  --shadow:0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --body-font-size:12.5px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  /* این background بعداً با body{background:var(--ui-bg)} بازنویسی می‌شود؛
     رنگ کرم قدیمی --bg دیگر در اینجا اثری ندارد، ولی خودِ متغیر --bg
     همچنان در .acc-panel استفاده می‌شود و حذف نشده است. */
  color:var(--ink);
  font-family:'Vazirmatn', system-ui, sans-serif;
  font-feature-settings:"ss01";
  line-height:1.7;
}
.app{
  display: flex;
  flex-direction: row;
  gap: 24px;
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px 18px 60px;
}

.app-sidebar{
  width: 220px;
  flex-shrink: 0;
}

.app-main{
  flex: 1;
  min-width: 0;
}

header.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}
header.top .brand{
  display:flex;
  align-items:center;
  gap:10px;
}
header.top .brand .dot{
  width:10px;height:10px;border-radius:50%;
  background:var(--amber);
}
header.top h1{
  font-size:17px;
  font-weight:700;
  margin:0;
  color:var(--charcoal);
}
header.top .sub{
  font-size:12px;
  color:var(--ink-soft);
  margin-top:2px;
}

/* Stepper */
.stepper{
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: sticky;
  top: 24px;
  padding-top: 72px;
  max-height: calc(100vh - 48px);
  overflow-y: auto;
  padding-left: 4px;
}

.step-pill{
  width: 100%;
  text-align: right;
  padding: 10px 12px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-soft);
  background: transparent;
  border-right: 4px solid var(--line);
  white-space: normal;
  cursor: pointer;
  transition: .15s;
  line-height: 1.4;
}

.step-pill:hover{background:#efede6;color:var(--ink);}
.step-pill.active{
  color: #8f5a26;
  background: var(--amber-soft);
  border-right-color: var(--amber);
  font-weight: 700;
}

.step-pill.active:hover{background:var(--amber-soft);}
.step-pill.personalize-tab{
  color:#9a6700;
}

.step-pill.personalize-tab.active{
  color: #7a5000;
  background: #fff4cf;
  border-right-color: #c89211;
}


.step-pill.personalize-tab:hover{
  background:#ffefb8;
}



.step-pill.done{
  color:var(--ok);
}

.card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:22px 22px 20px;
  margin-bottom:18px;
}
.card.card-daily{
  background:#eef7ee;
  border-color:#cfe6cf;
}
.card h2{
  font-size:15px;
  margin:0 0 4px;
  color:var(--charcoal);
  display:flex;
  align-items:center;
  gap:8px;
}
.card h2 .num{
  width:22px;height:22px;
  border-radius:50%;
  background:var(--charcoal);
  color:#fff;
  font-size:11px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.card .desc {
  font-size: 12.5px;
  color: var(--ink-soft);
  margin: 0 0 18px;
}

.about-container {
  font-size: 13px;
}

.about-text {
  font-size: 12.5px;
  line-height: 1.6;
}

.about-list {
  font-size: 12.5px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px 16px;
}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
@media(max-width:560px){
  .grid, .grid.cols-3{grid-template-columns:1fr;}
}

.field{
  display:flex;
  flex-direction:column;
  gap:5px;
}
.field.span2{grid-column:span 2;}
@media(max-width:560px){.field.span2{grid-column:span 1;}}

.field label{
  font-size:12.5px;
  font-weight:600;
  color:var(--ink);
}
.field .hint{
  font-size:10.5px;
  color:var(--ink-soft);
  font-weight:400;
  margin-inline-start:4px;
}
.field .req-star{
  color:var(--err);
  font-weight:800;

  --ui-ink:#27495c;       /* تیترها و برچسب‌ها */
  --ui-bg:#e7eef0;        /* زمینه‌ی صفحه */
  --ui-line:#d3dde1;
  --ui-field:#c6d4d9;
  --ui-amber:#ffc15e;
  --r-lg:16px;            /* پنل‌ها و کارت‌ها */
  --r-md:12px;            /* باکس‌ها، جدول‌ها */
  --r-sm:10px;            /* ورودی‌ها، دکمه‌ها، آیتم‌های استپر */
}
body{background:var(--ui-bg);}

/* ---------- سربرگ ---------- */
header.top h1{color:var(--ui-ink);}
header.top .brand .dot{background:var(--ui-amber);box-shadow:0 0 0 4px rgba(255,193,94,.28);}
.badge{background:var(--ui-deep);color:var(--ui-amber);}

/* ---------- پنل کناری (استپر) ---------- */
.app-sidebar{
  background:linear-gradient(180deg,var(--ui-mid),var(--ui-deep));
  border-radius:18px;
  padding:14px 10px 12px;
  box-shadow:0 8px 24px rgba(39,73,92,.22);
}
/* فقط دسکتاپ: ستون عمودی چسبیده با عنوان آکادمی (روی موبایل استپر افقی و اسکرول‌پذیر style.css می‌ماند) */
@media (min-width:901px){
  .app-sidebar{align-self:flex-start;position:sticky;top:18px;}
  .app-sidebar::before{
    content:"آکادمی آموزشی لیان";
    display:block;color:#ffd88f;font-size:11px;font-weight:800;letter-spacing:.3px;
    padding:2px 10px 10px;border-bottom:1px solid rgba(255,255,255,.16);margin-bottom:8px;
  }
  .stepper{position:static;padding-top:0;padding-left:0;gap:3px;max-height:none;overflow:visible;}
}
.step-pill{border-radius:var(--r-sm);border-right:3px solid transparent;color:#d6e4e9;}
.step-pill:hover{background:rgba(255,255,255,.10);color:#fff;}
.step-pill.active{background:rgba(255,193,94,.20);color:#fff;border-right-color:var(--ui-amber);}
.step-pill.active:hover{background:rgba(255,193,94,.26);}
.step-pill.done{color:#bdeccf;}
.step-pill.done::before{content:"✓ ";font-weight:800;}
.step-pill.personalize-tab{color:#ffe3a9;}
.step-pill.personalize-tab.active{background:rgba(255,193,94,.20);color:#fff0cc;border-right-color:var(--ui-amber);}
.step-pill.personalize-tab:hover{background:rgba(255,255,255,.10);}

/* ---------- کارت‌ها و فرم ---------- */
.card{border-radius:var(--r-lg);border:1px solid var(--ui-line);box-shadow:0 4px 14px rgba(39,73,92,.07);}
.card h2{color:var(--ui-ink);}
.card h2 .num{background:var(--ui-amber);color:var(--ui-deep);border-radius:9px;width:26px;height:26px;font-weight:800;}
.field label{color:var(--ui-ink);}
.field input[type=text],.field input[type=number],.field input[type=date],.field textarea{
  border:1px solid var(--ui-field);border-radius:var(--r-sm);
}
.field input:focus,.field textarea:focus{border-color:var(--ui-mid);box-shadow:0 0 0 3px rgba(255,193,94,.40);}
.field.invalid input,.field.invalid input[type=text]{border-color:var(--err)!important;}
.grad-sum-check .error-msg{border-radius:var(--r-sm);}

/* ---------- جدول‌ها (گرد‌گوشه) ---------- */
.sample-table{
  border-collapse:separate;border-spacing:0;
  border:1px solid var(--ui-line);border-radius:var(--r-md);overflow:hidden;
}
.sample-table th,.sample-table td{border:none;border-bottom:1px solid var(--ui-line);border-inline-end:1px solid var(--ui-line);}
.sample-table tr > *:last-child{border-inline-end:none;}
.sample-table tr:last-child > td{border-bottom:none;}
.sample-table th{background:var(--ui-head);color:#fff;}
.sample-table tr td:first-child{background:#f1f6f7;}
.sample-table td input:focus{border-radius:8px;}

/* ---------- باکس‌ها ---------- */
.live-box{
  background:var(--ui-deep);border:none;border-radius:var(--r-md);padding:14px 16px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
}
.live-box .lv-title{color:var(--ui-amber);}
.live-box .lv-row{border-top:1px dashed rgba(255,255,255,.18);}
.live-box .lv-label{color:#b9d0d8;}
.live-box .lv-value{color:var(--ui-amber);font-size:16px;text-shadow:0 0 10px rgba(255,193,94,.30);}
.choice{border-radius:var(--r-md);}
/* گزینه‌ی «فراخوانی اطلاعات اولیه‌ی آسفالت»: کادر سبز بسیار ملایم برای تمایز بصری (هم‌رنگ دکمه‌ی «ذخیره‌ی اطلاعات اولیه»)؛
   وقتی انتخاب شد همان حالت انتخاب (کهربایی) سایر گزینه‌ها را می‌گیرد */
.choice.choice-report{
  border-color:#a9d3bc;
  background:#f6fbf8;
  box-shadow:0 0 0 3px rgba(46,125,91,.08);
}
.choice.choice-report .title{color:#24664a;}
.choice.choice-report:hover{border-color:#2e7d5b;}
.choice.choice-report.selected{
  border-color:var(--amber);
  background:var(--amber-soft);
  box-shadow:0 0 0 3px rgba(255,193,94,.25);
}
.choice.choice-report.selected .title{color:var(--ink);}
body[data-theme="dark"] .choice.choice-report .title{color:#8fdaa9;}
body[data-theme="dark"] .choice.choice-report.selected .title{color:#a5e6b8;}
.confirm-box{border-radius:var(--r-md);}
.formula-card{border-radius:var(--r-md);}
.formula-box{border-radius:var(--r-sm);}
.formula-params{border-radius:var(--r-sm);}

/* ---------- دکمه‌ها ---------- */
button,.btn-ghost{border-radius:var(--r-sm);}
.btn-primary{background:var(--ui-mid);color:#fff;}
.btn-primary:hover{background:var(--ui-deep);}
.btn-primary:disabled{background:#dbe6ea;color:#9fb3bb;}
/* بازخورد حرکتی یکپارچه برای دکمه‌ها و کارت‌های قابل انتخاب */
button:not(:disabled),.choice,.step-pill{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,background-color .18s ease;}
button:not(:disabled):hover,.choice:hover{transform:translateY(-2px);box-shadow:0 5px 13px rgba(47,85,104,.17);}
button:not(:disabled):active,.choice:active{transform:translateY(0) scale(.985);box-shadow:0 1px 3px rgba(47,85,104,.14);}
button:focus-visible,.choice:focus-visible,.step-pill:focus-visible{outline:3px solid var(--ui-amber);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){
  button:not(:disabled),.choice,.step-pill{transition:none!important;}
  button:not(:disabled):hover,.choice:hover,button:not(:disabled):active,.choice:active{transform:none;}
}
.export-bar .btn-amber[style*="2196F3"]:not(:disabled){background:var(--ui-mid)!important;}   /* دکمه‌ی «دریافت تصویر» که رنگ آبی ثابتِ inline داشت */
.export-bar .btn-amber[style*="2196F3"]:not(:disabled):hover{background:var(--ui-deep)!important;}

/* ---------- موبایل / تبلت: پنل کناری تبدیل به نوار افقی گرد و اسکرول‌پذیر ---------- */
@media (max-width:900px){
  .app-sidebar{position:sticky;top:0;z-index:40;border-radius:var(--r-md);padding:8px 8px;align-self:stretch;}
  .stepper{background:transparent;backdrop-filter:none;border-bottom:none;margin:0;padding:2px;overflow-x:auto;overflow-y:hidden;}
  .step-pill{border-radius:var(--r-sm);border-right:none;border-bottom:3px solid transparent;}
  .step-pill.active,.step-pill.personalize-tab.active{border-right-color:transparent;border-bottom-color:var(--ui-amber);}
  .card{border-radius:var(--r-md);}
}

/* ---------- پنل محدوده‌ی پذیرش ----------
   زمینه بر مبنای رنگ پس‌زمینه‌ی فعال رابط کاربری، ۱۰٪ روشن‌تر محاسبه می‌شود. */
.acc-panel{
  background:color-mix(in srgb,var(--bg) 90%, white 10%);
  border:1.5px solid color-mix(in srgb,var(--line) 72%, white 28%);
  border-radius:var(--r-md);
  padding:12px 14px;margin:8px 0 20px;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 10%, transparent);
}
.acc-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:8px;}
.acc-head b{color:var(--ui-ink);font-size:13.5px;}
.acc-sub{font-size:11.5px;color:var(--ink-soft);line-height:1.8;}
.acc-row{
  display:grid;grid-template-columns:minmax(180px,2fr) 120px 120px;
  gap:6px 10px;align-items:end;padding:8px 8px;border-top:1px dashed color-mix(in srgb,var(--line) 75%, transparent);
}
.acc-row:first-of-type{border-top:none;}
.acc-name{font-weight:700;color:var(--ui-ink);font-size:12.5px;align-self:center;}
.acc-f label{font-size:10.5px;margin-bottom:2px;}
.acc-f input{padding:6px 9px;font-size:13px;text-align:right;background:var(--ui-field);color:var(--ink);}
.acc-f{margin:0;}
.acc-f input::placeholder{color:#9db0b8;opacity:1;}
.acc-src{margin-top:8px;font-size:11.5px;color:var(--ink-soft);}
.acc-src summary{cursor:pointer;color:var(--ui-mid);}
.acc-src ul{margin:6px 18px 0;padding:0;line-height:1.9;}
@media (max-width:640px){
  .acc-row{grid-template-columns:1fr 1fr;}
  .acc-name{grid-column:1 / -1;}
}

/* ---------- تب «تطبیق با معیارها» ---------- */
.cf-summary{border-radius:var(--r-md);padding:12px 16px;font-weight:700;font-size:14px;margin:6px 0 14px;}
.cf-summary.cf-ok{background:#e9f6ee;border:1.5px solid #9fd0b3;color:#1e6b43;}
.cf-summary.cf-bad{background:#fdecea;border:1.5px solid #e29a90;color:#a5321f;}
.cf-group{margin:0 0 14px;}
.cf-group-title{font-weight:800;color:var(--ui-ink);font-size:13.5px;margin:0 0 6px;display:flex;align-items:center;gap:8px;}
.cf-go{font-family:inherit;font-size:11.5px;font-weight:600;border:1px solid var(--ui-line);background:#fff;color:var(--ui-mid);
  border-radius:999px;padding:3px 12px;cursor:pointer;}
.cf-go:hover{border-color:var(--ui-mid);}
.cf-item{background:#fff4f2;border:1px solid #f0b9b2;border-right:4px solid var(--err);border-radius:var(--r-sm);
  padding:8px 12px;margin:0 0 6px;font-size:13px;line-height:1.9;color:#5a1d16;}
.cf-h{font-weight:800;color:var(--ui-ink);font-size:13.5px;margin:18px 0 8px;}
.cf-tbl{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--ui-line);border-radius:var(--r-md);overflow:hidden;font-size:12.5px;}
.cf-tbl th{background:var(--ui-mid);color:#fff;padding:7px 8px;font-weight:700;text-align:center;}
.cf-tbl td{padding:6px 8px;border-top:1px solid var(--ui-line);text-align:center;}
.cf-tbl td.cf-name{text-align:right;font-weight:600;}
.cf-tbl tr.cf-row-bad td{background:#fdecea;color:var(--err);font-weight:700;}
.cf-tbl tr.cf-row-ok td.cf-st{color:var(--ok);font-weight:700;}
.cf-tbl td.cf-na{color:var(--ink-soft);}
.cf-tblwrap{overflow-x:auto;}
.cf-vals td:last-child{width:130px;font-weight:700;color:var(--ui-ink);}
.cf-gmm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 10px;}
.cf-gmm div{background:#f4f8fa;border:1px solid var(--ui-line);border-radius:var(--r-sm);padding:8px 10px;text-align:center;font-size:12px;color:var(--ink-soft);}
.cf-gmm b{display:block;font-size:16px;color:var(--ui-ink);margin-top:2px;}
@media (max-width:640px){ .cf-gmm{grid-template-columns:1fr;} }

</style>

body[data-theme="dark"] .app-credit{color:#f2c98c;}

/* ۴) برگه‌ی گزارش نهایی همیشه مثل کاغذ روشن بماند؛
      متغیرهای محلی، اثر تم تیره روی متن/پس‌زمینه‌ی برگه را قطع می‌کند */
#reportSheet{
  --charcoal:#2b2e33;
  --ink:#232323;
  --ink-soft:#5b5f66;
  --amber-soft:#f3e6d6;
  --line:#e3e1db;
  background:#fff;
  color:#232323;
}
#reportSheet .rtable td{border-color:#b9b7b0;}

/* ۵) تب مارشال: فقط رنگ کادرِ گزینه‌ی انتخاب‌شده (پیش‌فرض‌ها: رینگ دیجیتال / بدون موم) متمایز شود */
.marshall-choice-group .choice.selected{
  border-color:var(--amber);
}
body[data-theme="dark"] .marshall-choice-group .choice.selected{
  border-color:#d39a5e;
}

/* ۶) رنگ ثابت دکمه‌های فعال در صفحه «شروع» بر اساس پالت برنامه */
.choice.start-choice-top.selected{
  border:2px solid var(--ui-deep) !important;
  background:#dce9ef !important;
  box-shadow:0 0 0 3px rgba(47,85,104,.18) !important;
}
.choice.start-choice-top.selected .title{
  color:var(--ui-deep) !important;
}
body[data-theme="dark"] .choice.start-choice-top.selected{
  border:2px solid #8bc9e5 !important;
  background:#2b4a59 !important;
  box-shadow:0 0 0 3px rgba(139,201,229,.20) !important;
}
body[data-theme="dark"] .choice.start-choice-top.selected .title{
  color:#ffffff !important;
}

.choice.start-choice-bottom.selected{
  border:2px solid var(--amber) !important;
  background:var(--amber-soft) !important;
  box-shadow:0 0 0 3px rgba(168,106,46,.18) !important;
}
.choice.start-choice-bottom.selected .title{
  color:#7a4a1c !important;
}
body[data-theme="dark"] .choice.start-choice-bottom.selected{
  border:2px solid #d39a5e !important;
  background:#493a2c !important;
  box-shadow:0 0 0 3px rgba(211,154,94,.22) !important;
}
body[data-theme="dark"] .choice.start-choice-bottom.selected .title{
  color:#ffd88f !important;
}

</style>

<style>
/* اصلاح اسکرول جدول وزن نمونه‌ها در موبایل */
@media (max-width: 900px){
  .tblbox{min-width:0;max-width:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;}
  .tblbox > .sample-table{display:table;width:max-content;min-width:100%;max-width:none;overflow:visible;}  /* بنرهای موقت زیر نوار تب‌ها نمایش داده شوند */
  body > div[style*="position:fixed"][style*="top:20px"]{top:76px!important;max-width:calc(100vw - 24px);}
  .stepper{scroll-padding-inline:12px;scroll-snap-type:x proximity;}
  .step-pill{scroll-snap-align:center;}
}

:root{--action-bg:#e8eff4;--action-ink:#27495c;--action-disabled-ink:#82939c;--action-border:#c6d5dd;--action-live-border:#8bc9e5;--action-hover:#dce9ef;}
body[data-theme="dark"]{--action-bg:#293c46;--action-ink:#eaf1f4;--action-disabled-ink:#82939c;--action-border:#4b616b;--action-live-border:#8bc9e5;--action-hover:#344d59;}
button{
  box-sizing:border-box!important;min-height:40px;padding:9px 14px!important;
  border:1.5px solid var(--action-border)!important;border-radius:var(--r-sm)!important;
  background:var(--action-bg)!important;color:var(--action-ink)!important;
  font-family:inherit!important;font-size:12.5px!important;font-weight:700!important;line-height:1.4!important;
  box-shadow:none!important;opacity:1!important;
  transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease,background-color .16s ease!important;
}
button:not(:disabled){border-color:var(--action-live-border)!important;}
button:disabled{background:var(--action-bg)!important;color:var(--action-disabled-ink)!important;border-color:var(--action-border)!important;cursor:not-allowed;}
button:not(:disabled):hover{background:var(--action-hover)!important;border-color:var(--action-live-border)!important;transform:translateY(-1px);box-shadow:0 3px 9px rgba(47,85,104,.14)!important;}
button:not(:disabled):active{transform:scale(.985);}
button:focus-visible{outline:3px solid var(--action-live-border);outline-offset:2px;}
.theme-switch button{min-height:0!important;padding:6px 11px!important;border:0!important;border-radius:7px!important;background:transparent!important;color:var(--ink-soft)!important;font-size:11.5px!important;line-height:normal!important;box-shadow:none!important;transition:background .15s,color .15s!important;}
.theme-switch button[aria-pressed="true"]{background:var(--ui-bg)!important;color:var(--ui-ink)!important;border:0!important;}
.theme-switch button:not(:disabled):hover{background:var(--action-hover)!important;border:0!important;transform:none!important;box-shadow:none!important;}
body[data-theme="dark"] .theme-switch button{color:#b7c7cf!important;}
body[data-theme="dark"] .theme-switch button[aria-pressed="true"]{background:#344f5d!important;color:#fff!important;}
.report-action-stack{display:flex;flex-direction:column;align-items:center;gap:8px;margin:12px auto;width:100%;}
.report-action-stack button{width:clamp(170px,25vw,320px);max-width:100%;}
.report-action-stack button:disabled,.report-action-stack button[disabled]{background:var(--action-bg)!important;color:var(--action-disabled-ink)!important;border-color:var(--action-border)!important;opacity:1!important;}
@media(prefers-reduced-motion:reduce){button{transition:none!important;}button:not(:disabled):hover,button:not(:disabled):active{transform:none;}}
.review-disabled .field,.review-disabled .acc-panel{opacity:.55}
.review-disabled input,.review-disabled textarea,.review-disabled select{cursor:not-allowed}
.review-note{margin:0 0 14px;padding:10px 12px;border-radius:8px;background:var(--amber-soft);color:var(--ink);font-size:12.5px;font-weight:700}
</style>

<script>
/* ===================== STATE ===================== */
/* بارگذاری تنبل html2canvas: کد این کتابخانه فقط وقتی که واقعاً دکمه‌ی
   «دریافت تصویر گزارش» زده می‌شود parse/اجرا می‌شود، نه در لحظه‌ی بازشدن صفحه. */
let __h2cLoaded = false;
function ensureHtml2Canvas(){
  return new Promise((resolve, reject)=>{
    if(__h2cLoaded || typeof window.html2canvas === "function"){ __h2cLoaded = true; resolve(); return; }
    try{
      const srcTag = document.getElementById("html2canvas-lib-src");
      const s = document.createElement("script");
      s.textContent = srcTag.textContent;
      document.head.appendChild(s);
      document.head.removeChild(s);
      __h2cLoaded = true;
      resolve();
    }catch(e){ reject(e); }
  });
}
</script>

/* پیکربندی متمرکز الک‌ها؛ داده‌های هر سایز مستقل‌اند، اما موتور محاسبات مشترک است. */

function getAsphaltSieveAt(size, mm){ return getAsphaltSieveConfig(size).find(x=>Math.abs(x.mm-mm)<0.001); }

function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  for(const k in attrs){
    if(k==="class") e.className = attrs[k];
    else if(k==="html") e.innerHTML = attrs[k];
    else e.setAttribute(k, attrs[k]);

    if(c===null||c===undefined) return;

/* ===================== محدوده‌ی ورود (کف و سقف تقریبی) =====================
   این‌ها «محدوده‌ی پذیرش مشخصات» نیستند (آن را مشاور اعلام می‌کند)؛ فقط جلوی عددهای «غیرممکن/اشتباه تایپی» را می‌گیرند
   (مثلاً 11800 به‌جای 1180) و عمداً بازند. مبنا: نمونه‌ی مارشال 4 اینچی آسفالت 19 میلی‌متری (بیندر/توپکا).
   هر ردیف: [کف، سقف، واحد]. کف/سقف می‌تواند null باشد (بدون قید)، و کل ردیف می‌تواند تابعی باشد که همین سه‌تایی را برگرداند.
   برای ویرایش یک محدوده، فقط عدد همان خط را عوض کن. */
const RANGE_LEVEL = "error";     // "error": کادر قرمز + قفل + مسدود شدن عبور از تب  |  "warn": فقط هشدار نارنجی (بدون مسدود کردن)  |  "off": خاموش
const _PCT = [0, 100, "%"];
const INPUT_RANGE = {

  pbaDesign:[0, 5, "%"],                // جذب قیر (معمولاً زیر 1.5)
  gac:[0.95, 1.10, ""],                 // وزن مخصوص قیر (معمولاً 1.00 تا 1.04)
  gmmDesign:[2.30, 2.80, ""], gaggDesign:[2.40, 2.90, ""],   // مثل Gmm / Gsb معمول

  specUp34:_PCT, specLow34:_PCT, specUp12:_PCT, specLow12:_PCT, specUp316:_PCT, specLow316:_PCT,
  specUp8:_PCT, specLow8:_PCT, specUp50:_PCT, specLow50:_PCT, specUp200:_PCT, specLow200:_PCT,
  specUp112:_PCT, specLow112:_PCT, specUp1:_PCT, specLow1:_PCT, specUp34_25:_PCT, specLow34_25:_PCT,
  specUp12_25:_PCT, specLow12_25:_PCT, specUp38_25:_PCT, specLow38_25:_PCT, specUp4_25:_PCT, specLow4_25:_PCT,
  specUp8_25:_PCT, specLow8_25:_PCT, specUp50_25:_PCT, specLow50_25:_PCT, specUp200_25:_PCT, specLow200_25:_PCT,

  /* وزن مخصوص: نمونه‌ی مارشال ~1200 gr با ارتفاع 63.5±6.5 mm (حدود 1100 تا 1360 gr) */
  air1:[1000,1600,"gr"], air2:[1000,1600,"gr"], air3:[1000,1600,"gr"],
  ssd1:[1000,1600,"gr"], ssd2:[1000,1600,"gr"], ssd3:[1000,1600,"gr"],
  water1:[500,1000,"gr"], water2:[500,1000,"gr"], water3:[500,1000,"gr"],      // ≈ 0.57 تا 0.60 وزن هوا
  wAir1:[1000,1600,"gr"], wAir2:[1000,1600,"gr"], wAir3:[1000,1600,"gr"],
  wSsd1:[1000,1600,"gr"], wSsd2:[1000,1600,"gr"], wSsd3:[1000,1600,"gr"],
  wWater1:[500,1000,"gr"], wWater2:[500,1000,"gr"], wWater3:[500,1000,"gr"],
  gmm:[2.30, 2.80, ""],                 // Gmm معمولاً 2.40 تا 2.70
  gwax:[0.7, 1.1, ""],                  // وزن مخصوص پارافین/موم ≈ 0.9

  /* درصد قیر (استخراج) */
  totalWeight:[500, 5000, "gr"], materialAfterWash:[500, 5000, "gr"],
  filterDryInitial:[0.1, 200, "gr"], filterAfterTest:[0.1, 200, "gr"],
  gasolineUsed:[0, 6000, "ml"],
  dishFactor:[0.1, 10, ""],

  /* دانه‌بندی */
  ret34:[0,5000,"gr"], ret12:[0,5000,"gr"], ret316:[0,5000,"gr"], ret8:[0,5000,"gr"], ret50:[0,5000,"gr"], ret200:[0,5000,"gr"],
  ret112:[0,5000,"gr"], ret1:[0,5000,"gr"], ret34_25:[0,5000,"gr"], ret12_25:[0,5000,"gr"], ret38_25:[0,5000,"gr"], ret4_25:[0,5000,"gr"], ret8_25:[0,5000,"gr"], ret50_25:[0,5000,"gr"], ret200_25:[0,5000,"gr"],
  crush34:[0,5000,"gr"], crush12:[0,5000,"gr"], crush316:[0,5000,"gr"], crush112:[0,5000,"gr"], crush1:[0,5000,"gr"], crush8:[0,5000,"gr"],

  /* مارشال */
  ringFactor:[0.5, 20, "kg/div"],
  dialReading:()=> S.ringType === "digital" ? [100, 8000, "kg"] : [20, 2000, "div"],   // دیجیتال: خود استحکام خام (kg) ؛ آنالوگ: تعداد درجه
  flow:[0.5, 10, "mm"]                  // نشریه 234 جدول 9-13: نرمی مجاز 2 تا 4.5 mm (مارشال استاندارد) و تا 6.8 mm (مارشال اصلاح‌شده)
};
function _rangeOf(key){
  if(RANGE_LEVEL === "off") return null;
  let r = INPUT_RANGE[key];
  if(typeof r === "function") r = r();
  return r || null;
}
/* مقدار نرمال‌شده‌ی عددی v برای key: پیام خارج‌ازمحدوده یا "" */
function rangeIssue(key, v){
  const r = _rangeOf(key);
  if(!r || !isFinite(v)) return "";
  const lo = r[0], hi = r[1], u = r[2] ? " " + r[2] : "";
  if((lo !== null && v < lo) || (hi !== null && v > hi))
    return "عدد خارج از محدوده‌ی منطقی ورود است؛ مقدار باید بین " + lo + " و " + hi + u + " باشد. (اشتباه تایپی؟ ممیز یا یک رقم اضافه/کم)";
  return "";
}

/* حالت «بررسی آسفالت»: شماره نمونه و کل تب «معرفی پروژه» غیرفعال و از اعتبارسنجی معاف‌اند */
const REVIEW_SKIP_KEYS = ["sampleNo","projectName","employer","contractor","reqNo","reqDate","reportDate","plant","asphaltType",
  "designDate","sampleDate","sampleTime","sampleLocation","asphaltTemp","ambientTemp","notes",
  "acc_temp_min","acc_temp_max","acc_amb_min","acc_amb_max"];
function reviewSkipped(key){ return S.reportMode === "review" && REVIEW_SKIP_KEYS.indexOf(key) !== -1; }

const _warnedKeys = {};
function fieldSpec(key){
  const sp = FIELD_SPEC[key];
  if(sp) return sp;
  if(!_warnedKeys[key]){ _warnedKeys[key]=1; console.warn("FIELD_SPEC: کلید تعریف‌نشده:", key); }
  return {kind:"text"};
}

/* ارقام فارسی/عربی → لاتین. فقط برای فیلدهای عددی/تاریخ/ساعت استفاده می‌شود.
   «٫» (ممیز عربی) نقطه‌ی اعشار حساب می‌شود؛ «/» عمداً دست‌نخورده می‌ماند. */
function toLatinDigits(s){
  return String(s ?? "")
    .replace(/[۰-۹]/g, c=>String(c.charCodeAt(0)-0x06F0))
    .replace(/[٠-٩]/g, c=>String(c.charCodeAt(0)-0x0660))
    .replace(/٫/g, ".")
    .replace(/−/g, "-");
}

/* گرد کردن دقیق دهدهی (half-up) روی رشته، بدون خطای ممیز شناور */
function _roundDec(intPart, fracPart, dec){
  intPart = intPart.replace(/^0+(?=\d)/, "") || "0";
  if(dec === null || dec === undefined) return fracPart ? intPart+"."+fracPart : intPart;
  const up = fracPart.length > dec && fracPart.charAt(dec) >= "5";
  const frac = fracPart.slice(0, dec).padEnd(dec, "0");
  let digits = (BigInt(intPart + frac) + (up ? 1n : 0n)).toString().padStart(dec+1, "0");
  return dec ? digits.slice(0, -dec) + "." + digits.slice(-dec) : digits;
}

const _MSG_NUM = "فرمت عدد نادرست است؛ فقط رقم و نقطه‌ی اعشار مجاز است (مثلاً 12.5). علامت «/» به معنی تقسیم نیست و پذیرفته نمی‌شود.";

/* → {value, error}.  ورودی خالی: error="" (خالی بودن را fieldError تشخیص می‌دهد) */
function normalizeField(key, raw){
  const spec = fieldSpec(key);
  if(spec.kind === "text") return {value: raw, error: ""};
  const v = toLatinDigits(raw).replace(/[‌‎‏]/g, "").trim();
  if(v === "") return {value:"", error:""};

  if(spec.kind === "num"){
    const m = /^(-?)(\d+\.?\d*|\.\d+)$/.exec(v);
    if(!m || (m[1] && !spec.neg)) return {value:v, error: spec.dec===0
      ? "عدد صحیح و بدون اعشار وارد کنید (مثلاً 25). علامت «/» پذیرفته نیست."
      : _MSG_NUM};
    const parts = m[2].split(".");
    let out = _roundDec(parts[0], parts[1] || "", spec.dec);
    if(m[1] && /[1-9]/.test(out)) out = "-" + out;
    if(RANGE_LEVEL === "error"){
      const re = rangeIssue(key, parseFloat(out));
      if(re) return {value: out, error: re, range: true};
    }
    return {value: out, error: ""};
  }
  if(spec.kind === "date"){
    const m = (spec.partial ? /^(\d{4})(?:\/(\d{1,2})(?:\/(\d{1,2}))?)?$/ : /^(\d{4})\/(\d{1,2})\/(\d{1,2})$/).exec(v);
    const y = m && +m[1], mo = m && m[2] !== undefined ? +m[2] : null, d = m && m[3] !== undefined ? +m[3] : null;
    if(!m || y < 1300 || y > 1500 || (mo !== null && (mo < 1 || mo > 12)) || (d !== null && (d < 1 || d > (mo <= 6 ? 31 : 30))))
      return {value:v, error: spec.partial
        ? "تاریخ شمسی را با رقم وارد کنید: فقط سال یا سال/ماه/روز (مثلاً 1404 یا 1404/05/12)."
        : "تاریخ شمسی را با رقم و به شکل سال/ماه/روز وارد کنید (مثلاً 1405/03/05)."};
    return {value: m[1] + (mo !== null ? "/" + String(mo).padStart(2,"0") : "") + (d !== null ? "/" + String(d).padStart(2,"0") : ""), error:""};
  }
  if(spec.kind === "time"){
    const m = /^(\d{1,2}):(\d{2})$/.exec(v);
    if(!m || +m[1] > 23 || +m[2] > 59)
      return {value:v, error:"ساعت را به شکل ساعت:دقیقه وارد کنید (مثلاً 14:30؛ ساعت 00 تا 23 و دقیقه 00 تا 59)."};
    return {value: String(+m[1]).padStart(2,"0") + ":" + m[2], error:""};
  }
  return {value:v, error:""};
}

/* --- قانون تب وزن مخصوص ---
   هر نمونه سه وزن دارد (هوا، آب، SSD). کافی است برای «حداقل یک نمونه» هر سه وزن وارد شود؛
   نمونه‌ای که کاملاً خالی است اشکالی ندارد. اما نمونه‌ی نیمه‌کاره (مثلاً فقط وزن هوا) ممنوع است،
   چون میانگین‌ها را خراب می‌کند و Va/VMA/VFA مثلاً -190 درمی‌آید. جدول موم هم همین قانون را دارد. */
const _SG_SETS = [
  [["air1","water1","ssd1"],["air2","water2","ssd2"],["air3","water3","ssd3"]],
  [["wAir1","wWater1","wSsd1"],["wAir2","wWater2","wSsd2"],["wAir3","wWater3","wSsd3"]]
];
const _isFilled = k => hasVal(S[k]) && String(S[k]).trim() !== "";
function sampleGroupOf(key){
  for(const set of _SG_SETS) for(const grp of set) if(grp.indexOf(key) !== -1) return {set:set, grp:grp};
  return null;
}
/* پیام خطای «خالی بودن» برای key (یا ""). strict=true یعنی هنگام عبور از تب (شامل لزوم یک نمونه‌ی کامل) */
function emptyError(key, strict){
  const spec = fieldSpec(key);
  if(spec.optional) return "";
  if(spec.activeIf && !spec.activeIf()) return "";
  const sg = sampleGroupOf(key);
  if(sg){
    if(sg.grp.some(_isFilled)) return "این نمونه نیمه‌کاره است: هر سه وزن (هوا، آب، SSD) را وارد کنید، یا هر سه را خالی بگذارید.";
    if(strict && !sg.set.some(g=>g.every(_isFilled))) return "حداقل برای یک نمونه باید هر سه وزن (هوا، آب، SSD) وارد شود.";
    return "";
  }
  return spec.emptyMsg || "این فیلد خالی است؛ لطفاً مقدار را وارد کنید.";
}

/* بررسی «لایو» حین تایپ: خطا فقط وقتی داده می‌شود که مقدار دیگر نتواند با ادامه‌ی تایپ معتبر شود
   (حرف، «/» در عدد، جداکننده‌ی نادرست ...) یا وقتی مقدار کامل است ولی نامعتبر (ماه 13).
   مقدار ناقصِ ولی در مسیر درست (مثل 1405/0) تا خروج از فیلد خطا نمی‌گیرد. */
function liveError(key, raw){
  const spec = fieldSpec(key);
  const v = toLatinDigits(raw).replace(/[\u200c\u200e\u200f]/g, "").trim();
  if(v === "") return emptyError(key, false);
  if(spec.kind === "text") return "";
  const full = normalizeField(key, v);
  if(!full.error) return "";
  if(full.range){
    // خارج از محدوده: با ادامه‌ی تایپ فقط وقتی دیگر درست نمی‌شود که از سقف گذشته باشد (رقم اضافه فقط بزرگ‌ترش می‌کند)
    // یا عدد منفی از کف پایین‌تر باشد. «کمتر از کف» (مثلاً 1 در راه 1200) تا خروج از فیلد صبر می‌کند.
    const val = parseFloat(full.value), rg = _rangeOf(key);
    return (rg && ((rg[1] !== null && val > rg[1]) || (rg[0] !== null && val < rg[0] && val < 0))) ? full.error : "";
  }
  let prefixOk = false;
  if(spec.kind === "num")  prefixOk = (spec.neg ? /^-?\d*\.?\d*$/ : /^\d*\.?\d*$/).test(v) && (spec.dec !== 0 || !/\./.test(v.replace(/\.$/, "")));
  if(spec.kind === "date"){
    // پیش‌وندِ معتبر: بخش‌هایی که کامل شده‌اند (سال 4 رقمی، ماه/روز 2 رقمی) باید در بازه باشند
    const m = /^(\d{0,4})(?:\/(\d{0,2})(?:\/(\d{0,2}))?)?$/.exec(v);
    prefixOk = !!m && !/^\d{4}\/\d{1,2}\/\d{1,2}$/.test(v)
      && !(m[1].length === 4 && (+m[1] < 1300 || +m[1] > 1500))
      && !(m[2] && m[2].length === 2 && (+m[2] < 1 || +m[2] > 12))
      && !(m[3] && m[3].length === 2 && (+m[3] < 1 || +m[3] > 31));
  }
  if(spec.kind === "time"){
    const m = /^(\d{0,2})(?::(\d{0,2}))?$/.exec(v);
    prefixOk = !!m && !/^\d{1,2}:\d{2}$/.test(v)
      && !(m[1].length === 2 && +m[1] > 23)
      && !(m[2] && m[2].length === 2 && +m[2] > 59);
  }
  return prefixOk ? "" : full.error;
}

/* پیام خطای فعلی مقدار S[key] ، یا "" اگر مشکلی نیست */
function fieldError(key){
  if(reviewSkipped(key)) return "";
  const spec = fieldSpec(key);
  if(spec.activeIf && !spec.activeIf()) return "";
  if(spec.virtual) return crossError(key);          // باکس مجازی (مثل کنترل جمع دانه‌بندی): فقط قانون بین‌فیلدی
  const raw = S[key];
  if(!hasVal(raw) || String(raw).trim() === "") return emptyError(key, true);
  const e = normalizeField(key, raw).error;
  return e || crossError(key);                      // اول فرمت، بعد ترتیب/رابطه‌ی بین فیلدها
}

/* ===================== قوانین بین‌فیلدی (ترتیب و رابطه‌ی مقادیر) =====================
   هر قانون یک «زنجیره» از کلیدهاست که باید به ترتیب مشخص باشند:
     order:"desc"  → هر مقدار ≤ مقدار قبلی در زنجیره (بزرگ ← کوچک)   [وزن‌ها]
     order:"asc"   → هر مقدار ≥ مقدار قبلی در زنجیره (قدیمی ← جدید)   [تاریخ‌ها]
   بررسی دوطرفه است: هر فیلد هم با نزدیک‌ترین فیلد پرِ «قبلی» و هم «بعدی» در زنجیره سنجیده می‌شود،
   و خطا روی همان فیلدی می‌نشیند که کاربر همین الان پر/ویرایش کرده (نه روی فیلد همسایه).
   مقایسه فقط بین مقادیر «پر و معتبر» است. تساوی: برای وزن‌های اصلی (وزن مخصوص و درصد قیر، strict:true) خطاست؛
   برای بقیه (تاریخ‌ها، شکسته ≤ مانده) مجاز است.
   قفل: اگر فیلد ویرایش‌شده با Tab/Enter ترک شود و خطای ترتیب داشته باشد، فوکوس در همان فیلد می‌ماند
   (مثل خطای فرمت). رفتن با ماوس، یا Shift+Tab به عقب، آزاد است تا بشود فیلد دیگر را اصلاح کرد. */
const _FLD_LABEL = {
  reqDate:"تاریخ درخواست", sampleDate:"تاریخ نمونه‌برداری", reportDate:"تاریخ گزارش", designDate:"تاریخ طرح",
  totalWeight:"وزن کل نمونه", materialAfterWash:"وزن مصالح پس از شست‌وشو",
  filterAfterTest:"وزن فیلتر پس از آزمایش", filterDryInitial:"وزن فیلتر اولیه",
  ret34:"وزن مانده الک 3/4", ret12:"وزن مانده الک 1/2", ret316:"وزن مانده الک 3/16",
  crush34:"وزن شکسته الک 3/4", crush12:"وزن شکسته الک 1/2", crush316:"وزن شکسته الک 3/16",
  ret112:"وزن مانده الک 1½", ret1:"وزن مانده الک 1", ret34_25:"وزن مانده الک 3/4 (سایز 25)",
  ret12_25:"وزن مانده الک 1/2 (سایز 25)", ret38_25:"وزن مانده الک 3/8", ret4_25:"وزن مانده الک #4",
  ret8_25:"وزن مانده الک #8 (سایز 25)", ret50_25:"وزن مانده الک #50 (سایز 25)", ret200_25:"وزن مانده الک #200 (سایز 25)",
  crush112:"وزن شکسته الک 1½", crush1:"وزن شکسته الک 1", crush8:"وزن شکسته الک #8"
};
const CROSS_RULES = [];
(function(){
  const lab = k => _FLD_LABEL[k] || k;
  const orderText = keys => keys.map(lab).join("، ");

  /* ۱) تاریخ‌ها. تاریخ درخواست عمداً در هیچ زنجیره‌ای نیست (می‌تواند همزمان یا حتی بعد از نمونه‌برداری باشد: دلایل اداری). */
  CROSS_RULES.push({kind:"date", order:"asc", keys:["sampleDate","reportDate"], suffix:true});      // نمونه‌برداری ≤ گزارش
  CROSS_RULES.push({kind:"date", order:"asc", keys:["designDate","reportDate"], suffix:false});     // طرح ≤ گزارش

  /* ۲) وزن مخصوص (هر نمونه): SSD ← هوا ← آب ؛ جدول موم: موم‌اندود در هوا ← خشک در هوا ← موم‌اندود در آب */
  for(let i=1;i<=3;i++){
    Object.assign(_FLD_LABEL, {["ssd"+i]:"وزن SSD نمونه "+i, ["air"+i]:"وزن در هوا نمونه "+i, ["water"+i]:"وزن در آب نمونه "+i,
      ["wSsd"+i]:"وزن موم‌اندود در هوا نمونه "+i, ["wAir"+i]:"وزن خشک در هوا نمونه "+i, ["wWater"+i]:"وزن موم‌اندود در آب نمونه "+i});
    CROSS_RULES.push({kind:"num", order:"desc", keys:["ssd"+i,"air"+i,"water"+i], suffix:true, strict:true});
    CROSS_RULES.push({kind:"num", order:"desc", keys:["wSsd"+i,"wAir"+i,"wWater"+i], suffix:true, strict:true});
  }

  /* ۳) درصد قیر: وزن کل ← مصالح پس از شست‌وشو ← فیلتر پس از آزمایش ← فیلتر اولیه */
  CROSS_RULES.push({kind:"num", order:"desc", keys:["totalWeight","materialAfterWash","filterAfterTest","filterDryInitial"], suffix:true, strict:true});

  /* ۴-ب) درصد شکستگی: وزن شکسته‌ی هر الک ≤ وزن مانده‌ی همان الک؛ الک‌های فعال بر اساس سایز */
  const fractureRules = [
    ["ret34","crush34"],["ret12","crush12"],["ret316","crush316"],
    ["ret112","crush112"],["ret1","crush1"],["ret34_25","crush34"],
    ["ret12_25","crush12"],["ret4_25","crush316"],["ret8_25","crush8"]
  ];
  fractureRules.forEach(keys=>CROSS_RULES.push({kind:"num", order:"desc", keys:keys, suffix:false,
    msgBefore:(cur,ref,refVal)=> lab(cur)+" نمی‌تواند از وزن مانده روی همان الک ("+refVal+" gr) بیشتر باشد؛ مصالح شکسته بخشی از مانده‌ی الک است."}));

  /* ساخت پیام: dir="before" یعنی فیلد مرجع «قبل» از این فیلد در زنجیره است، "after" یعنی بعد از آن */
  CROSS_RULES.forEach(rule=>{
    rule.msg = function(cur, ref, dir, refVal){
      if(dir === "before" && rule.msgBefore) return rule.msgBefore(cur, ref, refVal);
      let t;
      if(rule.order === "asc") t = lab(cur) + (dir === "before" ? " نمی‌تواند قبل از " : " نمی‌تواند بعد از ") + lab(ref) + " باشد";
      else if(rule.strict)     t = lab(cur) + " باید " + (dir === "before" ? "کمتر از " : "بیشتر از ") + lab(ref) + " باشد (برابر بودن هم مجاز نیست)";
      else                     t = lab(cur) + " نمی‌تواند از " + lab(ref) + (dir === "before" ? " بیشتر باشد" : " کمتر باشد");
      if(rule.suffix) t += " (ترتیب درست از " + (rule.order === "asc" ? "قدیمی به جدید" : "بزرگ به کوچک") + ": " + orderText(rule.keys) + ")";
      return t + ".";
    };
  });
})();
const CROSS_KEYS = {};
CROSS_RULES.forEach(r=>r.keys.forEach(k=>{ CROSS_KEYS[k] = true; }));
CROSS_KEYS.gradSum = true;

/* مقدار «پر و معتبر»ِ یک کلید برای مقایسه: عدد، یا آرایه‌ی [سال,ماه,روز]؛ وگرنه null */
function _crossVal(key){
  const sp = fieldSpec(key);
  if(sp.activeIf && !sp.activeIf()) return null;
  const raw = S[key];
  if(!hasVal(raw) || String(raw).trim() === "") return null;
  const r = normalizeField(key, raw);
  if(r.error) return null;
  if(sp.kind === "num") return parseFloat(r.value);
  if(sp.kind === "date") return r.value.split("/").map(Number);
  return null;
}
/* مقایسه‌ی تاریخ‌ها (ممکن است ناقص باشند: فقط سال، یا سال/ماه): فقط اجزای مشترک سنجیده می‌شوند */
function _cmpDate(a, b){
  const n = Math.min(a.length, b.length);
  for(let i=0;i<n;i++) if(a[i] !== b[i]) return a[i] < b[i] ? -1 : 1;
  return 0;
}
/* آیا «prev» (زودتر در زنجیره) و «next» (دیرتر در زنجیره) به ترتیب مجاز هستند؟ */
function _orderOk(rule, prev, next){
  if(rule.kind === "date") return rule.order === "asc" ? _cmpDate(prev, next) <= 0 : _cmpDate(prev, next) >= 0;
  if(rule.order === "desc") return rule.strict ? prev > next : prev >= next;     // وزن‌های اصلی: اکیداً کوچک‌تر شونده
  return rule.strict ? prev < next : prev <= next;
}

/* پیام خطای بین‌فیلدی برای key ، یا "" (دوطرفه: با نزدیک‌ترین فیلد پرِ قبلی و بعدی) */
function crossError(key){
  if(reviewSkipped(key)) return "";
  if(key === "gradSum") return _gradSumError();
  for(const rule of CROSS_RULES){
    const idx = rule.keys.indexOf(key);
    if(idx === -1) continue;
    const cur = _crossVal(key);
    if(cur === null) continue;
    for(let j=idx-1;j>=0;j--){
      const pv = _crossVal(rule.keys[j]);
      if(pv === null) continue;
      if(!_orderOk(rule, pv, cur)) return rule.msg(key, rule.keys[j], "before", normalizeField(rule.keys[j], S[rule.keys[j]]).value);
      break;
    }
    for(let j=idx+1;j<rule.keys.length;j++){
      const nx = _crossVal(rule.keys[j]);
      if(nx === null) continue;
      if(!_orderOk(rule, cur, nx)) return rule.msg(key, rule.keys[j], "after", normalizeField(rule.keys[j], S[rule.keys[j]]).value);
      break;
    }
  }
  return "";
}

/* بررسی «لایو» حین تایپ برای وزن‌ها: فقط تخلفی که با ادامه‌ی تایپ دیگر درست نمی‌شود.
   قانون بزرگ←کوچک یعنی هر وزن باید ≤ وزن‌های قبلی زنجیره باشد؛ با افزودن رقم، عدد فقط بزرگ‌تر می‌شود،
   پس اگر همین حالا از مرجع قبلی بیشتر است، همان لحظه خطاست. (تخلف از سمت «کمتر از بعدی» چون هنوز ممکن است
   با رقم‌های بعدی درست شود، فقط با خروج از فیلد گرفته می‌شود.) */
function crossErrorLive(key){
  for(const rule of CROSS_RULES){
    if(rule.kind !== "num" || rule.order !== "desc") continue;
    const idx = rule.keys.indexOf(key);
    if(idx < 1) continue;
    const cur = _crossVal(key);
    if(cur === null) continue;
    for(let j=idx-1;j>=0;j--){
      const pv = _crossVal(rule.keys[j]);
      if(pv === null) continue;
      if(rule.strict ? cur >= pv : cur > pv) return rule.msg(key, rule.keys[j], "before", normalizeField(rule.keys[j], S[rule.keys[j]]).value);
      break;
    }
  }
  return "";
}
/* آیا دو کلید عضو یک قانون ترتیب هستند؟ (برای آزاد گذاشتن رفتن از فیلد خطادار به فیلدِ هم‌قانونی) */
function sharesRule(a, b){
  return CROSS_RULES.some(r=>r.keys.indexOf(a) !== -1 && r.keys.indexOf(b) !== -1);
}

/* ۴-الف) کنترل جمع دانه‌بندی: جمع وزن مانده‌ی الک‌ها نباید از وزن کل مصالح خشک بیشتر شود؛
   چون ته‌مانده‌ی کف (Pan) = وزن کل − جمع مانده‌ها می‌شود و اگر منفی شود، جمع درصدها (با کف) دیگر 100 نمی‌شود. */
function _gradSumError(){
  const r = calculate(S);
  if(!(r.K7 > 0)) return "";                 // وزن کل مصالح هنوز قابل محاسبه نیست (تب درصد قیر)
  if(r.pan >= -1e-6) return "";
  const sum = r.K7 - r.pan;
  return "جمع وزن‌های مانده روی الک‌ها ("+sum.toFixed(1)+" gr) از وزن کل مصالح خشک ("+r.K7.toFixed(1)+" gr) بیشتر است؛ " +
         "ته‌مانده‌ی کف منفی می‌شود و جمع درصدها 100 نمی‌شود. وزن‌های الک‌ها یا اطلاعات تب «درصد قیر» را بازبینی کنید.";
}

<script>
/* ===================== CALCULATION ENGINE ===================== */
/* Faithful port of the verified formula chain from بیندر19ارجمندی-1404.xlsx
   (double-checked against cached workbook values; averaging bug fixed to
   include all 3 samples per user confirmation). */
function calculate(s){
  const air=[num(s.air1),num(s.air2),num(s.air3)];
  const water=[num(s.water1),num(s.water2),num(s.water3)];
  const ssd=[num(s.ssd1),num(s.ssd2),num(s.ssd3)];
  const avgAir = avg3(s.air1,s.air2,s.air3);
  const avgWater = avg3(s.water1,s.water2,s.water3);
  const avgSSD = avg3(s.ssd1,s.ssd2,s.ssd3);

  // Gmb و داده‌های حجمی فعال باید از همان روش انتخاب‌شده (با موم/بدون موم) بیایند.
  const HindWithoutWax = air.map((a,i)=> (ssd[i]-water[i])!==0 ? a/(ssd[i]-water[i]) : 0);
  const validHindWithoutWax = HindWithoutWax.filter(h => h > 0);
  const GmbWithoutWax = validHindWithoutWax.length > 0 ? validHindWithoutWax.reduce((sum,val)=>sum+val,0) / validHindWithoutWax.length : 0;

  let GmbWaxReport = null;
  let waxSampleVolumes = [];
  let waxDenominators = [];
  let wAir = [], wWater = [], wSsd = [];
  let HW = [];
  if(s.waxMethod==="with"){
    wAir=[num(s.wAir1),num(s.wAir2),num(s.wAir3)];
    wWater=[num(s.wWater1),num(s.wWater2),num(s.wWater3)];
    wSsd=[num(s.wSsd1),num(s.wSsd2),num(s.wSsd3)];
    const gwax = num(s.gwax)||0.9;
    waxDenominators = wAir.map((a,i)=> (wSsd[i]-wWater[i]) - ((wSsd[i]-a)/gwax));
    HW = wAir.map((a,i)=> waxDenominators[i]!==0 ? a/waxDenominators[i] : 0);
    waxSampleVolumes = waxDenominators.map((v,i)=>v>0 && wAir[i]>0 ? v : 0);
    const validHW = HW.filter(v => v > 0);
    GmbWaxReport = validHW.length > 0 ? validHW.reduce((a, b) => a + b, 0) / validHW.length : 0;
  }
  const Hind = s.waxMethod==="with" ? HW : HindWithoutWax;
  const GmbReport = s.waxMethod==="with" ? (GmbWaxReport || 0) : GmbWithoutWax;

  /* درصد قیر (استخراج) */
  const K3 = num(s.filterAfterTest) - num(s.filterDryInitial);
  const K4 = num(s.gasolineUsed)*num(s.dishFactor)/100;
  const K5 = K4+K3;
  const totalW = num(s.totalWeight);
  const Pb = totalW!==0 ? ((totalW-(num(s.materialAfterWash)+K5))/totalW)*100 : 0;
  const K7 = num(s.materialAfterWash)+K3+K4;

  /* دانه‌بندی: آرایه‌ی الک‌ها از پیکربندی سایز فعال خوانده می‌شود. */
  const sieveConfig = getAsphaltSieveConfig(s.asphaltSize);
  const retained = sieveConfig.map(x=>num(s[x.ret]));
  const sumRetained = retained.reduce((a,b)=>a+b,0);
  const pan = K7-sumRetained;
  let cumulative = 0;
  const passingValues = retained.map(v=>{
    cumulative += v;
    return K7>0 ? 100-(cumulative*100/K7) : 0;
  });
  const passingBySieve = {};
  sieveConfig.forEach((x,i)=>{ passingBySieve[x.ret] = passingValues[i]; });
  const passAt = mm => {
    const sieve = getAsphaltSieveAt(s.asphaltSize, mm);
    return sieve ? (passingBySieve[sieve.ret] ?? 0) : 0;
  };

  /* درصد شکستگی: نسبت مجموع وزن مصالح شکسته به وزن مانده روی الک‌های تعریف‌شده برای همان سایز */
  const fracturePairs = getAsphaltFracturePairs(s.asphaltSize);
  const fractureDen = fracturePairs.reduce((sum,p)=>sum+num(s[p.ret]),0);
  const fractureNum = fracturePairs.reduce((sum,p)=>sum+num(s[p.crush]),0);
  const fracturePct = fractureDen>0 ? fractureNum*100/fractureDen : 0;

  const sumRetPct = K7>0 ? sumRetained*100/K7 : 0;
  const panPct = K7>0 ? pan*100/K7 : 0;
  const sumPct = K7>0 ? sumRetPct+panPct : 0;

  /* وزن مخصوص حقیقی مصالح مخلوط (Gagg گزارش)؛ مرزهای تفکیک #8 و #200 برای هر دو سایز ثابت‌اند. */
  const passing8 = passAt(2.36), passing200 = passAt(0.075);
  const V20 = 100-passing8;
  const V21 = passing8-passing200;
  const V22 = passing200;
  const g1=num(s.g1), g2=num(s.g2), g3=num(s.g3);
  const denomF19 = (g1!==0?V20/g1:0)+(g2!==0?V21/g2:0)+(g3!==0?V22/g3:0);
  const F19 = denomF19!==0 ? 100/denomF19 : 0;

  const U13=Pb;
  const gwaxVal = num(s.gwax)||0.9;
  const activeAir = s.waxMethod==="with" ? avg3(wAir[0],wAir[1],wAir[2]) : avgAir;
  const activeVolumeDenominator = s.waxMethod==="with"
    ? ((avg3(wSsd[0],wSsd[1],wSsd[2])-avg3(wWater[0],wWater[1],wWater[2])) -
       (avg3(wSsd[0],wSsd[1],wSsd[2])-activeAir)/gwaxVal)
    : (avgSSD-avgWater);
  const P = activeVolumeDenominator;
  const O = P!==0 ? activeAir/P : 0;
  const E2 = num(s.pbaDesign), E3 = num(s.gac);
  const effBitumen = O!==0 ? U13-(((100-U13)*E2)/100) : 0;

  const ringFactor = s.ringType==="digital" ? 1 : num(s.ringFactor);
  const dialReading = num(s.dialReading);
  // ضریب اصلاح باید بر اساس حجم واقعی نمونه و با همان روش تعیین Gmb محاسبه شود.
  // بدون موم: حجم = وزن خشک در هوا / Gmb (از رابطه‌ی ارشمیدس معادل SSD-Water است).
  // با موم: حجم از اختلاف حجمی تصحیح‌شده‌ی روش موم به دست می‌آید؛ استفاده از وزن‌های بدون موم در این حالت خطاست.
  const sampleVolumes = s.waxMethod==="with"
    ? waxSampleVolumes
    : air.map((a, i) => (Hind[i] > 0 && a > 0) ? a / Hind[i] : 0);
  const validVolumes = sampleVolumes.filter(v => Number.isFinite(v) && v > 0);
  const avgVolume = validVolumes.length > 0 ? validVolumes.reduce((sum, v) => sum + v, 0) / validVolumes.length : 0;
  const correctionFactor = getCorrectionFactorFromTable(avgVolume);
  const stabilityRaw = dialReading * ringFactor;
  const stabilityCorrected = stabilityRaw * correctionFactor;

  const fillerToEffBitumen = effBitumen!==0 ? V22/effBitumen : 0;

  /* Va / VMA / VFA (دو مسیره) */
  // برای روش موم، حجم تصحیح‌شده‌ی موم‌اندود و وزن خشک متناظر مبنای Gmb در زنجیره VMA است.
  const F3o = activeVolumeDenominator;
  const F4o = F3o!==0 ? activeAir/F3o : 0;
  const sieve8 = getAsphaltSieveAt(s.asphaltSize, 2.36);
  const sieve200 = getAsphaltSieveAt(s.asphaltSize, 0.075);
  const passing8Mid = sieve8 ? (num(s[sieve8.specUp])+num(s[sieve8.specLow]))/2 : 0;
  const passing200Mid = sieve200 ? (num(s[sieve200.specUp])+num(s[sieve200.specLow]))/2 : 0;
  const V20d = 100-passing8Mid, V21d = passing8Mid-passing200Mid, V22d = passing200Mid;
  const denomGsbDesign = (g1!==0?V20d/g1:0)+(g2!==0?V21d/g2:0)+(g3!==0?V22d/g3:0);
  const gsbDesignComputed = denomGsbDesign!==0 ? 100/denomGsbDesign : 0;
  const gsbDesign = s.gsbSource==="design" ? gsbDesignComputed : num(s.gsbDesign);

  const pbaDesign = num(s.pbaDesign), gac=num(s.gac);
  const F5o = gac!==0 ? F4o*(Pb-pbaDesign)/gac : 0;
  const F6o = gac!==0 ? (F4o*Pb*pbaDesign)/(100*gac) : 0;
  const F7o = F5o+F6o;
  const F8o = gsbDesign!==0 ? (F4o*(100-Pb))/gsbDesign : 0;
  const VMA = 100-F8o;

  const gmm = num(s.gmm);
  let Va, VFA, vaMethod;
  if(hasVal(s.gmm) && gmm>0){
    // Gmm رایسِ نمونه با Gmb گزارش‌شده (میانگین Gmb نمونه‌های معتبر) جفت می‌شود.
    Va = 100*(gmm-GmbReport)/gmm;
    VFA = VMA!==0 ? 100*(VMA-Va)/VMA : 0;
    vaMethod = "gmm";
  } else if(F19 > 0){
    // بدون تست رایس، حجم مصالح را از Gagg روزانه‌ی همان دانه‌بندی واقعی بگیر.
    // GmmEstimated فقط برای نمایش در گزارش نهایی محاسبه می‌شود و ورودی Va نیست.
    const F8va = F4o*(100-Pb)/F19;
    Va = 100-(F7o+F8va);
    VFA = VMA!==0 ? (F7o/VMA)*100 : 0;
    vaMethod = "volumetric";
  } else {
    // بدون Gmm رایس و بدون Gagg قابل محاسبه، Va را از Gsb طرح جایگزین نکن.
    Va = null;
    VFA = VMA!==0 ? (F7o/VMA)*100 : 0;
    vaMethod = "unavailable";
  }

  const Gse = (gsbDesign !== 0 && (gac - (pbaDesign/100)*gsbDesign) !== 0)
      ? (gsbDesign * gac) / (gac - (pbaDesign/100) * gsbDesign) : 0;
  const Ps = 100 - Pb;
  const GmmEstimated = (Gse !== 0 && gac !== 0) ? 100 / ((Ps / Gse) + (Pb / gac)) : 0;

  const passing = {bySieve:passingBySieve};
  if(isAsphaltSize(s.asphaltSize)==="19"){
    ["p19","p9_5","p4_75","p2_36","p0_3","p0_075"].forEach((k,i)=>passing[k]=passingValues[i] ?? 0);
  } else {
    ["p37_5","p25","p19","p12_5","p9_5","p4_75","p2_36","p0_3","p0_075"].forEach((k,i)=>passing[k]=passingValues[i] ?? 0);
  }

  return {
    avgAir, avgWater, avgSSD, Hind, GmbReport, GmbWaxReport,
    Pb, K7, fracturePct, pan, sumPct, F19, effBitumen, stabilityCorrected, correctionFactor, avgVolume, sampleVolumes,
    fillerToEffBitumen, VMA, Va, VFA, vaMethod, F4o,
    gsbDesign, gsbDesignComputed, Gse, GmmEstimated, passing
  };
}
// --- محل قرارگیری: خارج از تابع calculate، مثلاً قبل از // FORM BUILDING HELPERS ---
function getCorrectionFactorFromTable(volume) {
  if (!Number.isFinite(Number(volume)) || Number(volume) <= 0) return 1.00;
  // جدول اصلاح مارشال بر مبنای حجم‌های صحیح (cm³) تعریف شده است؛
  // حجم محاسباتی اعشاری باید پیش از جست‌وجو به نزدیک‌ترین cm³ گرد شود
  // تا بین بازه‌های صحیح قرار نگیرد و به‌اشتباه ضریب 1 برنگردد.
  volume = Math.round(Number(volume));
  const table = [
