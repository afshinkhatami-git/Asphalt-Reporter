<script>
/* ===================== FORM BUILDING HELPERS ===================== */
/* نمایش/پاک کردن خطا روی یک فیلد (.field) یا یک خانه‌ی جدول (td.fcell) */
function showFieldError(host, msg){
  host.classList.remove("noted");
  host.classList.add("invalid");
  const em = host.querySelector(".error-msg");
  if(em) em.textContent = msg;
  const box = host.closest(".tblbox");
  if(box){
    box.classList.add("has-invalid");
    const t = box.querySelector(".tbl-error");
    if(t) t.textContent = msg;
  }
}
/* جدول وزن مخصوص: بعد از هر تغییر، پرچم‌های «خالی/نیمه‌کاره»ی خانه‌های خالی دوباره سنجیده می‌شود
   (مثلاً با تکمیل یا خالی کردن یک نمونه، قرمزی خانه‌های هم‌نمونه‌اش درست شود) */
function refreshSampleFlags(host){
  const table = host.closest && host.closest("table.sample-table");
  if(!table) return;
  table.querySelectorAll("td.fcell.invalid").forEach(td=>{
    const inp = td.querySelector("input");
    if(!inp || inp.value.trim() !== "" || !sampleGroupOf(td._key)) return;
    const em = emptyError(td._key, true);
    if(em) showFieldError(td, em); else clearFieldError(td);
  });
}

/* هشدار غیرمسدودکننده (نارنجی): مثل «با خروج از فیلد گرد می‌شود» */
function showFieldNote(host, msg){
  host.classList.add("noted");
  const em = host.querySelector(".error-msg");
  if(em) em.textContent = msg;
  const box = host.closest(".tblbox");
  if(box){
    box.classList.add("has-note");
    const t = box.querySelector(".tbl-error");
    if(t) t.textContent = msg;
  }
}
/* هشدار تذکری (نارنجی، بدون مسدود کردن) مخصوص بعضی فیلدها. فعلاً فقط «تاریخ گزارش»:
   اگر با تاریخ شمسی امروز فرق داشته باشد فقط تذکر می‌دهد؛ عبور از تب و ثبت گزارش را نمی‌بندد.
   (نام فایل‌های خروجی از همین تاریخ ساخته می‌شود — design-io.js.) live=true: حین تایپ، فقط وقتی تاریخ کامل شد. */
function fieldAdvisory(key, raw, live){
  if(key !== "reportDate") return "";
  raw = toLatinDigits(String(raw || "")).trim();
  if(live && !/^\d{4}\/\d{2}\/\d{2}$/.test(raw)) return "";
  const r = normalizeField(key, raw);
  if(r.error || !r.value) return "";
  const today = todayShamsi();                     // design-io.js
  if(r.value === today) return "";
  return "هشدار (مانع نیست): تاریخ گزارش " + (r.value > today ? "از تاریخ امروز (" + today + ") جلوتر است" : "با تاریخ امروز (" + today + ") فرق دارد") + ". نام فایل‌های خروجی از همین تاریخ ساخته می‌شود.";
}
function applyFieldAdvisory(host, key, raw, live){
  if(host.classList.contains("invalid")) return;
  const adv = fieldAdvisory(key, raw, live);
  if(adv) showFieldNote(host, adv);
}

/* بازسنجی خطاهای «بین‌فیلدی» (ترتیب تاریخ‌ها/وزن‌ها، کنترل جمع دانه‌بندی) برای فیلدهای هم‌کارت.
   mode="input" (حین تایپ): فقط خطاهای بین‌فیلدیِ رفع‌شده برداشته می‌شود؛ خطای تازه نمی‌نشیند
                (تا وسط تایپ مثل «1405/03/2» برای «1405/03/20» چشمک نزند).
   mode="blur"  (با خروج از فیلد): خطای تازه فقط روی «همین فیلدی که ترکش کردیم» می‌نشیند، نه روی
                فیلد همسایه؛ خطاهای رفع‌شده‌ی بقیه برداشته می‌شود. (باکس مجازی gradSum همیشه سنجیده می‌شود.)
   mode="all"   (بازگشت به تب): همه‌ی فیلدها کامل سنجیده می‌شوند. */
function refreshCrossFlags(host, mode){
  if(mode === false) mode = "all"; else if(mode === true) mode = "input";
  let root = host;
  while(root && root.parentNode) root = root.parentNode;     // بالاترین والد (کارتِ واقعی یا div موقت)
  if(!root || !root.querySelectorAll) return;
  root.querySelectorAll(".field, td.fcell").forEach(f=>{
    const key = f._key;
    if(!key || !CROSS_KEYS[key]) return;
    const owns = f.classList.contains("cross-invalid");
    if(mode === "input" && !owns) return;
    const msg = crossError(key);
    if(!msg){ if(owns) clearFieldError(f); return; }
    if(mode === "input") return;                              // حین تایپ، خطای موجود را دست نزن
    if(mode === "blur" && f !== host && !fieldSpec(key).virtual && !owns) return;   // خطای تازه فقط روی فیلد در حال ویرایش
    if(f.classList.contains("invalid") && !owns) return;      // خطای دیگری (خالی/فرمت) صاحب این باکس است
    showFieldError(f, msg);
    f.classList.add("cross-invalid");
  });
}

/* نحوه‌ی ترک فیلد: با کیبورد «به جلو» (Tab/Enter) یا نه (ماوس / Shift+Tab). برای قفل خطای ترتیب. */
let _navForward = false;
document.addEventListener("keydown", e=>{ _navForward = (e.key === "Enter") || (e.key === "Tab" && !e.shiftKey); }, true);
document.addEventListener("mousedown", ()=>{ _navForward = false; }, true);
document.addEventListener("touchstart", ()=>{ _navForward = false; }, true);

function clearFieldError(host){
  host.classList.remove("invalid");
  host.classList.remove("cross-invalid");
  host.classList.remove("noted");
  const nb = host.closest(".tblbox");
  if(nb && !nb.querySelector("td.noted")) nb.classList.remove("has-note");
  const box = host.closest(".tblbox");
  if(box && !box.querySelector("td.invalid")) box.classList.remove("has-invalid");
}

/* اتصال یک input به کلید S بر اساس نوع/دقت تعریف‌شده در FIELD_SPEC (field-types.js).
   host: عنصری که کلاس invalid روی آن می‌نشیند (.field یا td). */
function bindTypedInput(inp, key, host, onInput){
  const spec = fieldSpec(key);
  const typed = spec.kind !== "text";
  if(typed){
    inp.type = "text";
    inp.setAttribute("dir", "ltr");
    inp.setAttribute("autocomplete", "off");
    if(spec.kind === "num") inp.setAttribute("inputmode", spec.dec === 0 ? "numeric" : "decimal");
  }
  inp.value = S[key] ?? "";
  const optional = !!spec.optional;
  // مقدار نامعتبرِ قبلاً واردشده (برگشت از تب دیگر / بارگذاری طرح) از همان ابتدا قرمز نشان داده شود
  if(typed && inp.value.trim()){
    const e0 = normalizeField(key, inp.value).error;
    if(e0) setTimeout(()=>showFieldError(host, e0), 0);   // بعد از چسباندن به DOM (برای پیام زیر جدول)
    else if(CROSS_KEYS[key]) setTimeout(()=>refreshCrossFlags(host, false), 0);   // ترتیب/رابطه‌ی نامعتبرِ قبلی هم از ابتدا قرمز
  }
  if(inp.value.trim() && fieldAdvisory(key, inp.value, false)) setTimeout(()=>applyFieldAdvisory(host, key, inp.value, false), 0);   // برگشت به تب / بارگذاری فایل
  inp.addEventListener("input", ()=>{
    if(typed){
      const fixed = toLatinDigits(inp.value);      // ارقام فارسی → لاتین، همان لحظه
      if(fixed !== inp.value){
        const pos = inp.selectionStart;
        inp.value = fixed;
        try{ inp.setSelectionRange(pos, pos); }catch(e){}
      }
    }
    S[key] = inp.value;
    if(technicianImportActive) markImportMissingFields(host.closest(".card"));
    else host.classList.remove("import-missing");
    const msg = liveError(key, inp.value);          // فرمت/خالی بودن، لایو
    if(msg) showFieldError(host, msg);
    else {
      clearFieldError(host);
      // دقت لایو: اعشار بیش از حد مجاز → هشدار (نه خطا) با پیش‌نمایش مقدار گردشده.
      // متن حین تایپ دست‌نخورده می‌ماند (گرد کردن در هر ضربه رقم‌ها را می‌خورد)؛ گرد کردن با خروج از فیلد.
      if(spec.kind === "num" && typeof spec.dec === "number"){
        const m = /^-?\d*\.(\d*)$/.exec(toLatinDigits(inp.value).trim());
        if(m && m[1].length > spec.dec){
          const r = normalizeField(key, inp.value);
          if(!r.error) showFieldNote(host, (spec.dec === 0 ? "فقط عدد صحیح" : "حداکثر " + spec.dec + " رقم اعشار") + " — با خروج از فیلد گرد می‌شود: " + r.value);
        }
      }
    }
    // محدوده‌ی ورود در حالت «warn»: هشدار نارنجی (خطا نیست). حین تایپ فقط وقتی از سقف گذشته باشد؛ کامل‌تر با خروج از فیلد.
    if(!msg && RANGE_LEVEL === "warn" && spec.kind === "num" && !host.classList.contains("noted")){
      const rw = normalizeField(key, inp.value), rg = _rangeOf(key);
      if(!rw.error && rg && rg[1] !== null && parseFloat(rw.value) > rg[1]) showFieldNote(host, rangeIssue(key, parseFloat(rw.value)));
    }
    // وزن‌ها: تخلفِ قطعی از ترتیب (بزرگ‌تر از وزن قبلی در زنجیره) همان لحظه‌ی تایپ قرمز شود
    if(!msg && spec.kind === "num"){
      const le = crossErrorLive(key);
      if(le){ showFieldError(host, le); host.classList.add("cross-invalid"); }
    }
    refreshSampleFlags(host);
    refreshCrossFlags(host, "input");             // اگر این تغییر خطای ترتیبِ فیلد دیگری را رفع کرد، همان لحظه سبز شود
    if(!msg) applyFieldAdvisory(host, key, inp.value, true);   // تذکر غیرمسدودکننده (تاریخ گزارش ≠ امروز)
    if(onInput) onInput();
  });
  // با خروج از فیلد: قالب‌بندی نهایی (صفر اعشار، تاریخ 0 دار ...) ؛ ناقص/نامعتبر/خالی → قرمز
  inp.addEventListener("blur", (ev)=>{
    if(typed){
      const r = normalizeField(key, inp.value);
      if(r.error){
        // خطای مشخص در ورودی: اجازه‌ی عبور از این باکس داده نمی‌شود تا اصلاح شود
        showFieldError(host, r.error);
        setTimeout(()=>{ if(inp.isConnected){ inp.focus(); try{ inp.setSelectionRange(inp.value.length, inp.value.length); }catch(e){} } }, 0);
        return;
      }
      if(r.value !== inp.value){
        inp.value = r.value;
        inp.dispatchEvent(new Event("input", {bubbles:true}));   // برای به‌روزرسانی باکس‌های برخط
      }
    }
    if(!inp.value.trim()){
      const em = emptyError(key, false);
      if(em) showFieldError(host, em);
    } else if(RANGE_LEVEL === "warn" && typed && spec.kind === "num"){
      const rw = rangeIssue(key, parseFloat(normalizeField(key, inp.value).value));
      if(rw && !host.classList.contains("invalid")) showFieldNote(host, rw);
    }
    refreshSampleFlags(host);
    refreshCrossFlags(host, "blur");                // با خروج از فیلد: ترتیب تاریخ‌ها/وزن‌ها و کنترل جمع دانه‌بندی
    applyFieldAdvisory(host, key, inp.value, false);   // تذکر غیرمسدودکننده (بعد از بازسنجی ترتیب، تا پاک نشود)
    // خطای ترتیب روی همین فیلد + خروج با Tab/Enter به جلو → فوکوس در همین فیلد می‌ماند (مثل خطای فرمت)
    // با ماوس/لمس: فقط رفتن به یک «فیلد دیگرِ خارج از همین قانون» قفل می‌شود؛ رفتن به فیلد هم‌قانونی (برای اصلاح) یا جای خالی آزاد است
    let toOther = false;
    const rt = ev && ev.relatedTarget;
    if(rt && (rt.tagName === "INPUT" || rt.tagName === "TEXTAREA")){
      const rh = rt.closest && rt.closest(".field, td.fcell");
      toOther = !(rh && rh._key && sharesRule(key, rh._key)) && rh !== host;
    }
    if(inp.value.trim() && host.classList.contains("cross-invalid") && (_navForward || toOther)){
      setTimeout(()=>{ if(inp.isConnected){ inp.focus(); try{ inp.setSelectionRange(inp.value.length, inp.value.length); }catch(e){} } }, 0);
    }
  });
}

const PROJECT_EMPTY_HIGHLIGHT_KEYS = [];
function makeField(key, label, opts={}){
  const spec = fieldSpec(key);
  const wrap = el("div", {class:"field"+(opts.span2?" span2":"")});
  const lab = el("label", {}, label);
  if(opts.hint){
    const hintEl = el("span",{class:"hint"}, opts.hint);
    if(opts.hintColor) hintEl.style.color = opts.hintColor;
    lab.appendChild(hintEl);
  }
  wrap.appendChild(lab);
  let input;
  if(opts.type==="textarea"){
    input = el("textarea", {rows:"3"});
    input.value = S[key] ?? "";
    input.addEventListener("input", ()=>{ S[key]=input.value; clearFieldError(wrap); if(technicianImportActive) markImportMissingFields(wrap.closest(".card")); });
  } else {
    input = el("input", {type:"text"});
    bindTypedInput(input, key, wrap);
    if(spec.kind === "num" && typeof spec.dec === "number")
      input.setAttribute("placeholder", spec.dec ? "0." + "0".repeat(spec.dec) : "0");
    if(spec.kind !== "text") input.style.textAlign = "right";
  }
  wrap.appendChild(input);
  const errMsg = el("div",{class:"error-msg"}, "این فیلد خالی است؛ لطفاً مقدار را وارد کنید.");
  wrap.appendChild(errMsg);
  wrap._key = key;
  return wrap;
}

function makeAsphaltSizeField(label="سایز آسفالت"){
  const wrap = el("div", {class:"field"});
  wrap.appendChild(el("label", {}, label));
  const select = el("select", {dir:"rtl", class:"design-size-select"});
  select.appendChild(el("option", {value:"19"}, "۱۹ میلی‌متر"));
  select.appendChild(el("option", {value:"25"}, "۲۵ میلی‌متر"));
  select.value = isAsphaltSize(S.asphaltSize);
  select.addEventListener("change", ()=>{
    const previousSize = isAsphaltSize(S.asphaltSize);
    const nextSize = isAsphaltSize(select.value);
    S.asphaltSize = nextSize;
    if(previousSize !== nextSize && typeof DESIGN_KEYS !== "undefined"){
      DESIGN_KEYS.forEach(k=>{
        if(k !== "asphaltSize" && ACCEPT_KEYS.indexOf(k) === -1) S[k] = "";
      });
      S.gsbSource = "design";
    }
    renderApp();
  });
  wrap.appendChild(select);
  wrap.appendChild(el("div", {class:"error-msg"}, "سایز آسفالت را انتخاب کنید."));
  wrap._key = "asphaltSize";
  return wrap;
}

function sectionHead(text){ return el("div",{class:"subhead"}, text); }

function sampleTable(title, rows, cols){
  // rows: [{label, keys:[k1,k2,k3]}], cols: ["نمونه ۱","نمونه ۲","نمونه ۳"]
  // ساختار جدید: هر ستون (نمونه) شامل سه ورودی برای air, water, ssd
  const box = el("div", {class:"tblbox"});
  box.appendChild(sectionHead(title));
  const table = el("table",{class:"sample-table"});
  const thead = el("tr",{}, [el("th",{},"")].concat(cols.map(c=>el("th",{},c))));
  table.appendChild(thead);
  
  // ایجاد ردیف‌ها به ترتیب قبلی (هر ردیف یک پارامتر: هوا، آب، SSD)
  rows.forEach(r=>{
    const tr = el("tr");
    tr.appendChild(el("td",{},r.label));
    r.keys.forEach(k=>{
      const td = el("td",{class:"fcell"});
      td._key = k;
      const inp = el("input",{type:"text"});
      bindTypedInput(inp, k, td);
      // اضافه کردن data-attribute برای شناسایی ستون (نمونه)
      inp.dataset.sample = k.replace(/[^\d]/g, ''); // استخراج شماره نمونه
      td.appendChild(inp);
      tr.appendChild(td);
    });
    table.appendChild(tr);
  });
  box.appendChild(table);
  box.appendChild(el("div",{class:"tbl-error"},""));
  return box;
}


/* ===================== LIVE RESULT BOX (نمایش برخط نتایج محاسبه) ===================== */
function liveFmt(v, d=2){
  if(v===null || v===undefined || isNaN(v) || v===0) return "—";
  return Number(v).toFixed(d);
}
function liveFmtPct(v, d=1){
  const f = liveFmt(v,d);
  return f==="—" ? "—" : f+" %";
}
function liveResultBox(title, rows){
  // rows: [{id, label, suffix?}]
  const box = el("div",{class:"live-box"});
  box.appendChild(el("div",{class:"lv-title"},"⚡ "+title));
  const spans = {};
  rows.forEach(r=>{
    const rowEl = el("div",{class:"lv-row"});
    rowEl.appendChild(el("span",{class:"lv-label"},r.label));
    const val = el("span",{class:"lv-value"},"—");
    spans[r.id] = val;
    rowEl.appendChild(val);
    box.appendChild(rowEl);
  });
  box._spans = spans;
  return box;
}
/* اتصال یک باکس برخط به یک container: هر تغییر ورودی داخل container باعث
   فراخوانی محاسبه‌ی مجدد و به‌روزرسانی مقادیر می‌شود (event delegation) */
function bindLiveBox(container, box, updater){
  const refresh = ()=>{ updater(calculate(S), box._spans); };
  container.addEventListener("input", refresh);
  refresh();
}

/* قانون کلی: هر فیلد خالی یا با فرمت غلط → کادر قرمز + پیام، و false (اجازه‌ی عبور نمی‌دهد).
   فیلدهای معتبر هم نرمال می‌شوند (ارقام لاتین، گرد کردن اعشار اضافه) و در S و input می‌نشینند. */
function validateStep(container){
  let ok = true;
  container.querySelectorAll(".invalid").forEach(x=>x.classList.remove("invalid"));
  container.querySelectorAll(".has-invalid").forEach(x=>x.classList.remove("has-invalid"));
  container.querySelectorAll(".field, td.fcell").forEach(f=>{
    if(f._validator){
      const customMsg = f._validator();
      if(customMsg){ showFieldError(f, customMsg); ok = false; }
      return;
    }
    const key = f._key;
    if(!key) return;
    const spec = fieldSpec(key);
    if(spec.activeIf && !spec.activeIf()) return;
    const msg = fieldError(key);
    if(msg){
      showFieldError(f, msg);
      if(msg === crossError(key)) f.classList.add("cross-invalid");   // تا با رفع مشکل در فیلد دیگر، خودکار پاک شود
      ok = false; return;
    }
    if(spec.kind !== "text" && hasVal(S[key]) && String(S[key]).trim() !== ""){
      const r = normalizeField(key, S[key]);
      S[key] = r.value;
      const inp = f.querySelector("input");
      if(inp) inp.value = r.value;
    }
  });
  return ok;
}
</script>
<script>
/* ===================== محدوده‌ی پذیرش (حداقل / حداکثر) =====================
   بالای هر تب ورودی یک پنل «محدوده‌ی پذیرش» می‌نشیند: برای هر پارامترِ همان تب دو باکس حداقل/حداکثر
   (مشاور اعلام می‌کند). باکس خالی = مقدار پیش‌فرض استاندارد (به‌صورت کم‌رنگ دیده می‌شود)، پر = جایگزین.
   پذیرش «نمونه‌به‌نمونه» است و فقط گزارش می‌دهد (مسدود نمی‌کند): نمونه‌ی خارج از مشخصات هم باید ثبت شود.
   الک‌ها (دانه‌بندی) و بنزین مصرفی عمداً بررسی نمی‌شوند.

   **هیچ پیام عدم تطابقی داخل تب‌های ورودی نشان داده نمی‌شود.** همه‌ی تناقض‌ها (عدم تطابق با محدوده‌ی پذیرش و
   اختلاف طرح/گزارش) یک‌جا در تب «تطبیق با معیارها» (قبل از «گزارش نهایی») لیست می‌شوند: js/steps/conflicts.js از
   acceptEvaluateAll() استفاده می‌کند.

   پیش‌فرض‌ها (ترافیک سنگین؛ نشریه 101 ویرایش 1404 فصل 20، AASHTO T245 و تصمیم‌های کاربر):
   - دمای آسفالت 100–163 °C ، دمای محیط ≥ 10 °C
   - Gmb 2.20–2.50 ، Pb 3.5–6.5 ٪
   - شکستگی دو جبهه ≥ 80٪ (ESAL 3 تا 10 میلیون، عمق ≤ 100 mm)
   - Va 2.4–5.6 (4 ± 1.6) ، VMA ≥ 13 ، VFA 65–75 ، F/A 0.6–1.2   (استحکام و نرمی بررسی پذیرش ندارند)
   - اختلاف مجاز ±0.04 (مقدار = گزارش − طرح):
       Gagg (Gsb) گزارش با Gagg طرح ،
       و فقط در صورت انجام تست رایس: Gse گزارش با Gse طرح و Gmm رایس با Gmm طرح
   کلیدهای S: acc_<id>_min و acc_<id>_max ؛ با طرح اختلاط ذخیره/بارگذاری می‌شوند (DESIGN_KEYS).
   F/A: حدود رواداری‌اش در پنل «محدوده‌ی پذیرش» تب «دانه‌بندی» است (tabs:["gradation"])؛ مقدار برخطش در تب مارشال هم نمایش داده می‌شود.
   افزودن پارامتر جدید = یک ردیف در ACCEPT_DEFS.
   هر ردیف: items(r, tab) → [{v, name?, desc?, lv?, disp?}] ؛ lv = شناسه‌ی ردیف در live-box (فقط برای نمایش مقدار). */

/* عدد معتبر S[k] یا null (خالی/نامعتبر) */
function _accN(k){
  if(!hasVal(S[k]) || String(S[k]).trim() === "") return null;
  const r = normalizeField(k, S[k]);
  if(r.error) return null;
  const v = parseFloat(r.value);
  return isNaN(v) ? null : v;
}
const _accAll = keys => keys.every(k => _accN(k) !== null);
const _accRound = (v, d) => { const p = Math.pow(10, d); return Math.round(v * p + (v >= 0 ? 1e-9 : -1e-9)) / p; };
const _accTxt = v => String(+Number(v).toFixed(3));        // بدون صفرهای اضافه‌ی انتها
/* متن عدد برای پیام: خروجی‌های سه‌رقمی (Gmb) با همان دقت، بقیه بدون صفر اضافه */
const _accShow = (d, v) => (d.dec !== null && d.dec >= 3) ? Number(v).toFixed(d.dec) : _accTxt(v);
/* مقدار نمایشی (ردیف‌های اختلاف با علامت: +0.012 / -0.051) */
const _accVal = (d, v) => (d.signed && v > 0 ? "+" : "") + _accShow(d, v);

const _pbReady   = () => _accAll(["totalWeight","filterDryInitial","filterAfterTest","materialAfterWash","gasolineUsed","dishFactor"]);
const _gradReady = () => _accAll(getAsphaltSieveConfig().map(x=>x.ret));
const _fractureReady = () => _accAll(getAsphaltFracturePairs().flatMap(x=>[x.ret,x.crush]));
/* آمادگی ویژگی‌های حجمی: وزن مخصوص نمونه + درصد قیر + Gsb طرح */
const _volReady  = r => r.GmbReport > 0 && _pbReady() && r.gsbDesign > 0;
const _pos = v => (v > 0 ? v : null);

/* ---- کنترل اختلاف «طرح» با «گزارش» (Gmm رایس / Gse / Gagg) ---- */
/* Gse گزارش از Gmm رایس (اندازه‌گیری‌شده) و Pb نمونه:  Gse = (100 - Pb) / (100/Gmm - Pb/Gac) */
function _gseReport(r){
  const gmm = _accN("gmm"), gac = _accN("gac");
  if(!(gmm > 0) || !(gac > 0) || !_pbReady() || !(r.K7 > 0)) return null;
  const den = 100 / gmm - r.Pb / gac;
  return den > 0 ? (100 - r.Pb) / den : null;
}
/* Gse طرح (محاسبه‌شده): Gse = (100 - Pb) / (100/Gmm - Pb/Gac) با Gmm طرح، Pb بهینه‌ی طرح و Gac (هر سه الزامی در تب «طرح اختلاط») */
function gseDesignValue(){
  const gmm = _accN("gmmDesign"), pb = _accN("pbOptimum"), gac = _accN("gac");
  if(!(gmm > 0) || !(gac > 0) || pb === null || !(pb > 0 && pb < 100)) return null;
  const den = 100 / gmm - pb / gac;
  return den > 0 ? (100 - pb) / den : null;
}
const _gseDesign  = () => gseDesignValue();
/* Gagg (Gsb) گزارش = وزن مخصوص حقیقی مصالح همان روز (F19: از دانه‌بندی واقعی نمونه و G1..G3) */
const _gaggReport = r => (_pbReady() && _gradReady() && r.K7 > 0 && r.F19 > 0) ? r.F19 : null;
/* اختلاف با دقت 3 رقم (هر دو طرف اول گرد می‌شوند) */
const _diff3 = (a, b) => (a === null || b === null || a === undefined || b === undefined) ? null : _accRound(_accRound(a, 3) - _accRound(b, 3), 3);

const ACCEPT_DEFS = [
  { id:"temp", tabs:["project"], label:"دمای آسفالت", unit:"°C", dec:null,
    def:()=>({min:100, max:163}),
    src:"حداقل 100 °C تصمیم کاربر؛ حداکثر 163 °C نشریه 101 بند 6-3-5-3-20 (دامنه‌ی خود نشریه 124 تا 163؛ نشریه 234 حداقل 120)",
    items:()=>[{v:_accN("asphaltTemp"), field:"asphaltTemp"}],
    low:"مخلوط سرد است و ممکن است به تراکم لازم نرسد.",
    high:"مخلوط داغ است؛ خطر سوختن قیر و روان شدن مخلوط." },

  { id:"amb", tabs:["project"], label:"دمای محیط", unit:"°C", dec:null,
    def:()=>({min:10, max:null}),
    src:"نشریه 234 بند 9-14-3 (پخش آسفالت در دمای محیط کمتر از 10 درجه ممنوع است)",
    items:()=>[{v:_accN("ambientTemp"), field:"ambientTemp"}],
    low:"پخش آسفالت در دمای محیط زیر 10 درجه مجاز نیست." },

  { id:"gmb", tabs:["sg"], label:"وزن مخصوص مارشال (Gmb)", unit:"", dec:OUTPUT_DEC.gmb,
    def:()=>({min:2.20, max:2.50}),
    src:"تصمیم کاربر (Gmb هر نمونه و میانگین)",
    items:(r)=>[
      {v:_pos(r.Hind && r.Hind[0]), name:"Gmb نمونه 1", lv:"gmb1"},
      {v:_pos(r.Hind && r.Hind[1]), name:"Gmb نمونه 2", lv:"gmb2"},
      {v:_pos(r.Hind && r.Hind[2]), name:"Gmb نمونه 3", lv:"gmb3"},
      {v:_pos(r.GmbReport), name:"میانگین Gmb", lv:"gmb", main:true}],
    low:"احتمال خطای وزن‌کشی (هوا/آب/SSD) یا مخلوط سبک/متخلخل.",
    high:"احتمال خطای وزن‌کشی (هوا/آب/SSD) یا مخلوط بسیار سنگین." },

  { id:"pb", tabs:["bitumen"], label:"درصد قیر (Pb)", unit:"%", dec:OUTPUT_DEC.pb,
    def:()=>({min:3.5, max:6.5}),
    src:"تصمیم کاربر (محدوده‌ی 3.5 تا 6.5 درصد)",
    items:(r)=>[{v:(_pbReady() && r.K7 > 0) ? r.Pb : null, lv:"pb"}],
    low:"قیر کمتر از حد مجاز است؛ خطر کم‌دوامی و ریزش مصالح.",
    high:"قیر بیش از حد مجاز است؛ خطر قیرزدگی و کاهش فضای خالی." },

  { id:"crush", tabs:["gradation"], label:"درصد شکستگی (دو جبهه)", unit:"%", dec:OUTPUT_DEC.fracture,
    def:()=>({min:80, max:null, note:"ESAL 3 تا 10 میلیون، عمق ≤ 100 mm؛ برای 10 تا 30 میلیون: 90 و ≥ 30 میلیون: 100"}),
    src:"نشریه 101 ج 3-20 (دو جبهه؛ ستون ESAL را با پروژه تطبیق بده)",
    items:(r)=>[{v:(_fractureReady() && getAsphaltFracturePairs().reduce((a,p)=>a+num(S[p.ret]),0) > 0) ? r.fracturePct : null, lv:"frac"}],
    low:"مصالح درشت کمتر از حد لازم شکسته است؛ منبع/سنگ‌شکن و جداسازی مصالح را بررسی کن." },

  { id:"va", tabs:["marshall"], label:"فضای خالی (Va)", unit:"%", dec:OUTPUT_DEC.va,
    def:()=>({min:2.4, max:5.6, note:"هدف طرح 4 ± 1.6"}),
    src:"نشریه 101 ج 28-20 (هدف طرح 4٪؛ محدوده‌ی طراحی 3 تا 5 در ج 5-20)",
    items:(r)=>[{v:(r.GmbReport > 0 && ((r.vaMethod === "gmm" && _accN("gmm") !== null) || _volReady(r))) ? r.Va : null, lv:"va"}],
    low:"فضای خالی کم است؛ خطر قیرزدگی و شیارافتادگی.",
    high:"فضای خالی زیاد است؛ خطر نفوذ آب و ریزش دانه‌ها." },

  { id:"vma", tabs:["marshall"], label:"فضای خالی بین سنگدانه‌ها (VMA)", unit:"%", dec:OUTPUT_DEC.vma,
    def:()=>({min:13, max:null, note:"اندازه‌ی 19 mm و Va=4؛ اگر اندازه‌ی اسمی 12.5 است: 14"}),
    src:"نشریه 101 ج 7-20",
    items:(r)=>[{v:_volReady(r) ? r.VMA : null, lv:"vma"}],
    low:"VMA کم است؛ جای کافی برای قیر مؤثر نیست (کاهش دوام)." },

  { id:"vfa", tabs:["marshall"], label:"فضای خالی پرشده با قیر (VFA)", unit:"%", dec:OUTPUT_DEC.vfa,
    def:()=>({min:65, max:75}),
    src:"نشریه 101 ج 5-20 (ترافیک سنگین؛ در نشریه 234 حداقل 60)",
    items:(r)=>[{v:_volReady(r) ? r.VFA : null, lv:"vfa"}],
    low:"VFA کم است؛ قیر نسبت به فضای خالی کم است.",
    high:"VFA زیاد است؛ خطر قیرزدگی." },

  { id:"fa", tabs:["gradation"], label:"نسبت فیلر به قیر مؤثر (F/A)", unit:"", dec:OUTPUT_DEC.fa,
    def:()=>({min:0.6, max:1.2}),
    src:"نشریه 101 بند 3-3-1-2-20 و نشریه 234 بند 9-7-7",
    items:(r)=>[{v:(_volReady(r) && _gradReady() && r.effBitumen > 0) ? r.fillerToEffBitumen : null, lv:"fa"}],
    low:"فیلر نسبت به قیر مؤثر کم است.",
    high:"فیلر نسبت به قیر مؤثر زیاد است؛ مخلوط خشک و دیر کوبیده می‌شود." },

  /* ----- اختلاف طرح/گزارش: مقدار = گزارش − طرح ؛ حدود پیش‌فرض ±0.04 (تصمیم کاربر) ----- */
  { id:"dgmm", dev:true, tabs:["sg"], label:"اختلاف Gmm رایس با Gmm طرح", unit:"", dec:3, signed:true,
    def:()=>({min:-0.04, max:0.04, note:"فقط وقتی تست رایس انجام شده؛ Gmm طرح در تب «طرح اختلاط»"}),
    src:"تصمیم کاربر: اختلاف مجاز 0.04 بین Gmm رایس اندازه‌گیری‌شده روی نمونه و Gmm طرح (رایس در قیر بهینه). Gmm محاسباتی در کنترل اختلاف‌ها دخالت ندارد و فقط در گزارش نهایی نمایش داده می‌شود.",
    items:()=>{
      const rice = _accN("gmm"); if(rice === null) return [];
      const des = _accN("gmmDesign");
      return [{v:_diff3(rice, des), name:"اختلاف Gmm رایس با Gmm طرح",
        desc:(des !== null) ? "رایس " + rice.toFixed(3) + "، طرح " + des.toFixed(3) : ""}];
    },
    low:"Gmm رایس نمونه از Gmm طرح کمتر است؛ تغییر مصالح/قیر یا خطای آزمایش رایس را بررسی کن.",
    high:"Gmm رایس نمونه از Gmm طرح بیشتر است؛ تغییر مصالح/قیر یا خطای آزمایش رایس را بررسی کن." },

  { id:"dgse", dev:true, tabs:["sg"], label:"اختلاف Gse گزارش با Gse طرح", unit:"", dec:3, signed:true,
    def:()=>({min:-0.04, max:0.04, note:"فقط با تست رایس. Gse گزارش از Gmm رایس و Pb نمونه؛ Gse طرح از Gmm طرح، Pb بهینه و Gac (تب «طرح اختلاط»)"}),
    src:"تصمیم کاربر: اختلاف Gse طرح با Gse گزارش حداکثر 0.04. هر دو با فرمول Gse = (100-Pb)/(100/Gmm - Pb/Gac): گزارش با Gmm رایس و Pb نمونه، طرح با Gmm طرح و Pb بهینه",
    items:(r)=>{ const gr = _gseReport(r), gd = _gseDesign();
      return [{v:_diff3(gr, gd), disp:gr, lv:"gse", desc:(gr !== null && gd !== null) ? "گزارش " + gr.toFixed(3) + "، طرح " + gd.toFixed(3) : ""}]; },
    low:"Gse گزارش از طرح کمتر است؛ جذب قیر/جنس مصالح یا Gmm رایس و درصد قیر را بررسی کن.",
    high:"Gse گزارش از طرح بیشتر است؛ جذب قیر/جنس مصالح یا Gmm رایس و درصد قیر را بررسی کن." },

  { id:"dgagg", dev:true, tabs:["gradation"], label:"اختلاف Gagg (Gsb) گزارش با Gagg طرح", unit:"", dec:3, signed:true,
    def:()=>({min:-0.04, max:0.04, note:"Gagg طرح را در تب «طرح اختلاط» وارد کن"}),
    src:"تصمیم کاربر: اختلاف Gagg طرح (جدول مشاور) با Gagg گزارش (وزن مخصوص حقیقی مصالح همان روز، از دانه‌بندی واقعی نمونه) حداکثر 0.04",
    items:(r)=>{ const gr = _gaggReport(r), gd = _accN("gaggDesign");
      return [{v:_diff3(gr, gd), disp:gr, lv:"gagg", desc:(gr !== null && gd !== null) ? "گزارش " + gr.toFixed(3) + "، طرح " + gd.toFixed(3) : ""}]; },
    low:"Gagg گزارش از طرح کمتر است؛ دانه‌بندی/منبع مصالح با طرح متفاوت است.",
    high:"Gagg گزارش از طرح بیشتر است؛ دانه‌بندی/منبع مصالح با طرح متفاوت است." }
];

const ACCEPT_KEYS = [];
ACCEPT_DEFS.forEach(d=>{
  d.kmin = "acc_" + d.id + "_min";
  d.kmax = "acc_" + d.id + "_max";
  [d.kmin, d.kmax].forEach(k=>{
    ACCEPT_KEYS.push(k);
    FIELD_SPEC[k] = _num(null, {optional:true, neg:true});     // اختیاری؛ فقط فرمت عدد چک می‌شود (منفی مجاز: حدود ردیف‌های «اختلاف»)
    if(!(k in S)) S[k] = "";
  });
  /* حداقل ≤ حداکثر (هر دو پر باشند) */
  const rule = {kind:"num", order:"asc", keys:[d.kmin, d.kmax], suffix:false, strict:false};
  rule.msg = (cur, ref, dir, refVal)=> dir === "before"
    ? "حداکثر نمی‌تواند از حداقل (" + refVal + ") کمتر باشد."
    : "حداقل نمی‌تواند از حداکثر (" + refVal + ") بیشتر باشد.";
  CROSS_RULES.push(rule);
  CROSS_KEYS[d.kmin] = true; CROSS_KEYS[d.kmax] = true;
});

/* حدود مؤثر: عدد واردشده توسط کاربر، وگرنه پیش‌فرض */
function acceptLimits(d){
  const df = d.def() || {};
  const umin = _accN(d.kmin), umax = _accN(d.kmax);
  return {
    min: umin !== null ? umin : (df.min === undefined ? null : df.min),
    max: umax !== null ? umax : (df.max === undefined ? null : df.max),
    df: df
  };
}

/* ارزیابی یک پارامتر: {state:"na"|"ok"|"bad", items:[...], bad:[...], main, L} */
function acceptEvaluate(d, r, tab){
  const L = acceptLimits(d), eps = 1e-9;
  const items = d.items(r, tab).map(it=>{
    const o = Object.assign({state:"na"}, it);
    let v = it.v;
    if(v === null || v === undefined || isNaN(v)) { o.v = null; return o; }
    if(d.dec !== null) v = _accRound(v, d.dec);
    o.v = v;
    if(L.min === null && L.max === null) return o;
    const low = L.min !== null && v < L.min - eps, high = L.max !== null && v > L.max + eps;
    if(!low && !high){ o.state = "ok"; return o; }
    o.state = "bad";
    const lim = (low ? "حداقل مجاز " + _accVal(d, L.min) : "حداکثر مجاز " + _accVal(d, L.max)) + (d.unit ? " " + d.unit : "");
    const hint = low ? d.low : d.high;
    o.text = (it.name || d.label) + " " + _accVal(d, v) + (it.desc ? " (" + it.desc + ")" : "") + (d.unit ? " " + d.unit : "") + (low ? " کمتر از " : " بیشتر از ") + lim + " است." + (hint ? " " + hint : "");
    return o;
  });
  const bad = items.filter(i => i.state === "bad");
  const state = bad.length ? "bad" : (items.some(i => i.state === "ok") ? "ok" : "na");
  const main = items.find(i => i.main) || items[0] || {v:null};
  return {d:d, L:L, items:items, bad:bad, state:state, main:main};
}

/* متن مقدار برای ردیف‌های live-box (مثلاً Va در تب مارشال)؛ «—» اگر هنوز قابل محاسبه نیست */
function accLiveText(id, r, tab){
  const d = ACCEPT_DEFS.find(x => x.id === id);
  if(!d) return "—";
  const it = d.items(r, tab)[0] || {};
  const v = it.disp !== undefined ? it.disp : it.v;      // ردیف‌های اختلاف: خودِ مقدار گزارش را نشان بده، نه اختلاف
  if(v === null || v === undefined || isNaN(v)) return "—";
  return (d.dec === null ? _accTxt(v) : Number(v).toFixed(d.dec)) + (d.unit ? " " + d.unit : "");
}

/* ارزیابی همه‌ی پارامترها (همه‌ی تب‌ها) با وضعیت فعلی S — برای تب «تطبیق با معیارها» */
function acceptEvaluateAll(){
  const r = calculate(S);
  return ACCEPT_DEFS.map(d => { const ev = acceptEvaluate(d, r, d.tabs[0]); ev.tab = d.tabs[0]; return ev; });
}

/* پنل بالای تب (بعد از عنوان و توضیح کارت): فقط باکس‌های حداقل/حداکثر + منبع پیش‌فرض‌ها.
   tab: project | sg | bitumen | gradation | marshall */
function addAcceptPanel(card, tab){
  const defs = ACCEPT_DEFS.filter(d => d.tabs.indexOf(tab) !== -1);
  if(!defs.length) return;
  const panel = el("div", {class:"acc-panel"});
  panel.appendChild(el("div", {class:"acc-head"}, [
    el("b", {}, "محدوده‌ی پذیرش (ترافیک سنگین)"),
    el("span", {class:"acc-sub"}, "حداقل/حداکثر ابلاغی مشاور را وارد کن. باکس خالی = مقدار پیش‌فرض استاندارد (کم‌رنگ). عدم تطابق‌ها اینجا نشان داده نمی‌شوند؛ در تب «تطبیق با معیارها» (قبل از گزارش نهایی) لیست می‌شوند و جلوی ثبت را نمی‌گیرند.")
  ]));
  defs.forEach(d=>{
    const row = el("div", {class:"acc-row"});
    row.appendChild(el("div", {class:"acc-name"}, d.label + (d.unit ? " (" + d.unit + ")" : "")));
    const df = d.def() || {};
    const mk = (key, cap, ph)=>{
      const host = el("div", {class:"field acc-f"});
      host.appendChild(el("label", {}, cap));
      const inp = el("input", {type:"text", placeholder: (ph === undefined || ph === null) ? "—" : _accTxt(ph)});
      bindTypedInput(inp, key, host);
      host.appendChild(inp);
      host.appendChild(el("div", {class:"error-msg"}, ""));
      host._key = key;
      return host;
    };
    row.appendChild(mk(d.kmin, "حداقل", df.min));
    row.appendChild(mk(d.kmax, "حداکثر", df.max));
    panel.appendChild(row);
  });
  /* منبع و توضیح پیش‌فرض‌ها (جمع‌شونده) */
  const det = el("details", {class:"acc-src"});
  det.appendChild(el("summary", {}, "منبع پیش‌فرض‌ها"));
  const ul = el("ul", {});
  defs.forEach(d=>{ const df = d.def() || {}; ul.appendChild(el("li", {}, d.label + ": " + d.src + (df.note ? " — " + df.note : ""))); });
  det.appendChild(ul);
  panel.appendChild(det);

  const desc = card.querySelector(".desc");
  if(desc && desc.parentNode === card) card.insertBefore(panel, desc.nextSibling);
  else card.insertBefore(panel, card.firstChild);
}
</script>

/* ===================== تاریخ شمسی و سریال گزارش =====================
   تاریخ شماره سریال از «تاریخ گزارش» گرفته می‌شود؛ تاریخ نامعتبر/خالی به تاریخ امروز شمسی برمی‌گردد. */
function gregorianToJalali(gy, gm, gd){
  const gdm = [0,31,59,90,120,151,181,212,243,273,304,334];
  const gy2 = gm > 2 ? gy + 1 : gy;
  let days = 355666 + 365*gy + Math.floor((gy2+3)/4) - Math.floor((gy2+99)/100) + Math.floor((gy2+399)/400) + gd + gdm[gm-1];
  let jy = -1595 + 33*Math.floor(days/12053);
  days %= 12053;
  jy += 4*Math.floor(days/1461);
  days %= 1461;
  if(days > 365){ jy += Math.floor((days-1)/365); days = (days-1) % 365; }
  const jm = days < 186 ? 1 + Math.floor(days/31) : 7 + Math.floor((days-186)/30);
  const jd = 1 + (days < 186 ? days % 31 : (days-186) % 30);
  return [jy, jm, jd];
}

/* تاریخ شمسی امروز (ساعت سیستم کاربر) به شکل 1405/08/16 */
function todayShamsi(){
  const t = new Date(), j = gregorianToJalali(t.getFullYear(), t.getMonth()+1, t.getDate());
  return j[0] + "/" + String(j[1]).padStart(2,"0") + "/" + String(j[2]).padStart(2,"0");
}

/* تاریخ شمسی به‌صورت فشرده: 14050816 */
function shamsiDateCompact(){
  const m = /^(\d{4})\/(\d{1,2})\/(\d{1,2})$/.exec(String(S.reportDate || "").trim());
  const parts = m ? [+m[1], +m[2], +m[3]] : todayShamsi().split("/").map(Number);
  return String(parts[0]) + String(parts[1]).padStart(2,"0") + String(parts[2]).padStart(2,"0");
}
function sanitizeSerialToken(val, fallback="---"){
  const clean=toLatinDigits(String(val??"")).trim().replace(/[^0-9A-Za-z-]/g,"");
  return clean || fallback;
}
function sampleNumberForFilename(){
  return sanitizeSerialToken(S.sampleNo, "بدون-شماره");
}
function makeReportSerial(){
  const dt = shamsiDateCompact();
  const usr = sanitizeSerialToken(S.userCode, "USR");
  const dsn = sanitizeSerialToken(S.designCode, "DSN");
  const smp = sanitizeSerialToken(S.sampleNo, "SMP");
  return "ASR_" + dt + "_" + usr + "_" + dsn + "_" + smp;
}

/* ===================== ذخیره‌ی فایل JSON با پرسیدن مسیر از کاربر =====================
   دو جا JSON ذخیره می‌شود: «طرح اختلاط» (تب طرح اختلاط) و «اطلاعات اولیه‌ی آسفالت» (تب گزارش نهایی).
   هر دو از همین تابع می‌گذرند و پنجره‌ی «ذخیره‌ی با نام» باز می‌شود تا کاربر پوشه و نام را خودش انتخاب کند.
   - Chrome / Edge / Opera (کامپیوتر): showSaveFilePicker. پارامتر id باعث می‌شود مرورگر آخرین پوشه‌ی هر نوع فایل را جدا به یاد بسپارد.
   - مرورگرهایی که این امکان را ندارند (Firefox، اندروید): ناچاریم دانلود معمولی انجام شود؛ مسیر را فقط
     تنظیم خود مرورگر («همیشه بپرس کجا ذخیره شود») کنترل می‌کند.
   خروجی: Promise با {ok, cancelled, picked, name}. باید مستقیماً داخل رویداد کلیک صدا زده شود (نیاز به user activation). */
function saveJsonWithPicker(text, fileName, pickerId){
  fileName = String(fileName).replace(/[\\/:*?"<>|]/g, "-");
  if(!/\.json$/i.test(fileName)) fileName += ".json";
  const writeIntoDirectory = async ()=>{
    const dir = await window.showDirectoryPicker({mode:"readwrite", id:pickerId || "asphalt-json-folder"});
    const handle = await dir.getFileHandle(fileName,{create:true});
    const writable = await handle.createWritable();
    await writable.write(text); await writable.close();
    return {ok:true,picked:true,name:fileName,directory:dir.name};
  };
  const saveAsFile = async ()=>{
    const handle=await window.showSaveFilePicker({
      suggestedName:fileName,
      types:[{description:"فایل JSON",accept:{"application/json":[".json"]}}],
      id:pickerId || "asphalt-json-file"
    });
    const writable=await handle.createWritable();
    await writable.write(text); await writable.close();
    return {ok:true,picked:true,name:handle.name};
  };
  if(typeof window.showDirectoryPicker === "function"){
    return writeIntoDirectory().catch(e=>{
      if(e && e.name==="AbortError") return {ok:false,cancelled:true};
      if(typeof window.showSaveFilePicker==="function") return saveAsFile().catch(x=>x&&x.name==="AbortError"?{ok:false,cancelled:true}:({ok:false,error:x}));
      return {ok:false,error:e};
    });
  }
  if(typeof window.showSaveFilePicker === "function"){
    return saveAsFile().catch(e=>e&&e.name==="AbortError"?{ok:false,cancelled:true}:({ok:false,error:e}));
  }
  alert("این مرورگر امکان انتخاب مستقیم پوشه یا نشانی ذخیره‌سازی را ارائه نمی‌کند. برای تعیین محل ذخیره، برنامه را در نسخه دسکتاپ Chrome یا Edge و از یک مبدأ امن (HTTPS یا localhost) باز کنید.");
  return Promise.resolve({ok:false,unsupported:true});
}

/* ۱) ذخیره‌ی طرح اختلاط */
function saveDesignToFile(){
  const name = (S.designName && S.designName.trim()) ? S.designName.trim() : "طرح-اختلاط";

/* ۲) ذخیره‌ی اطلاعات اولیه‌ی آسفالت (فایل کامل گزارش) */
function saveFullReportToFile(){
  const serial=S.archivedReport&&S.reportSerial?S.reportSerial:makeReportSerial();
  const fileName=reportFileBase(serial)+".json";
  const payload=collectFullReportData();
  payload._reportSerial=serial;
  payload._userCode=S.userCode||((/^ASR_\d{8}_([^_]+)_/.exec(serial)||[])[1]||"");
  payload._reportMode=S.archivedReport?"archived":"official";
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");
  link.href=url;
  link.download=fileName;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  S.reportSerial=serial;
  S.rawSaveRequested=true;
  S.rawSaved=false;
  S.reportGenerated=false;
  return {ok:true,name:fileName,serial};
}

function loadFullReportFromFile(file, onDone){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const obj = JSON.parse(reader.result);
      if(!obj || typeof obj !== "object"){ onDone && onDone(false); return; }
      applyFullReportData(obj);
      onDone && onDone(true);
    }catch(e){ onDone && onDone(false); }
  };
  reader.readAsText(file, "utf-8");
}

  const specTable = el("table",{class:"sample-table"});
  const specInputEls = [];
  specTable.appendChild(el("tr",{},[el("th",{},"الک"),el("th",{},"حد بالا"),el("th",{},"حد پایین")]));
  specRows.forEach(([lbl,up,low])=>{
    const tr = el("tr");
    tr.appendChild(el("td",{},lbl));
    [up,low].forEach(k=>{
      const td_=el("td",{class:"fcell"});
      td_._key = k;
      const inp=el("input",{type:"text"});
      bindTypedInput(inp, k, td_, refreshGsbDisplay);
      td_.appendChild(inp);
      tr.appendChild(td_);
      specInputEls.push(inp);
    });
    specTable.appendChild(tr);
  });
  card.appendChild(el("div",{class:"tblbox"},[specTable, el("div",{class:"tbl-error"},"")]));

  card.appendChild(sectionHead("Gsb طرح و پارامترهای مرتبط"));
  const gsbSrcGroup = el("div",{class:"choice-group",style:"margin-bottom:12px;"});
  const srcDesign = el("div",{class:"choice"+(S.gsbSource==="design"?" selected":"")},[
    el("div",{class:"title"},"از اطلاعات اوزان مخصوص طرح (G1,G2,G3)"),
    el("div",{class:"desc2"},"محاسبه‌ی خودکار — پیش‌فرض")
  ]);
  const srcDaily = el("div",{class:"choice"+(S.gsbSource==="daily"?" selected":"")},[
    el("div",{class:"title"},"از اطلاعات روزانه"),
    el("div",{class:"desc2"},"ورود دستی مقدار — برای زمانی که بخواهیم از مصالح همان روز محاسبه کنیم")
  ]);
  const gsbManualWrap = el("div",{style:"margin-top:10px;"+(S.gsbSource==="daily"?"":"display:none;")});
  const gsbManualField = makeField("gsbDesign","Gsb (ورود دستی)");
  gsbManualWrap.appendChild(gsbManualField);
  const gsbComputedWrap = el("div",{style:"margin-top:10px;"+(S.gsbSource==="design"?"":"display:none;")});
  const gsbComputedDisplay = el("div",{style:"font-size:13.5px;font-weight:700;color:var(--blue);background:var(--blue-soft);border-radius:7px;padding:9px 12px;"},"—");
  gsbComputedWrap.appendChild(el("div",{style:"font-size:12.5px;font-weight:600;margin-bottom:5px;"},"Gsb محاسبه‌شده (از G1/G2/G3 و میانه‌ی بازه‌ی مشخصات فنی)"));
  gsbComputedWrap.appendChild(gsbComputedDisplay);

  function refreshGsbDisplay(){
    if(S.gsbSource!=="design") return;
    const g1=num(S.g1), g2=num(S.g2), g3=num(S.g3);
    const sieve8 = getAsphaltSieveAt(S.asphaltSize, 2.36);
    const sieve200 = getAsphaltSieveAt(S.asphaltSize, 0.075);
    const p8 = sieve8 ? (num(S[sieve8.specUp])+num(S[sieve8.specLow]))/2 : 0;
    const p200 = sieve200 ? (num(S[sieve200.specUp])+num(S[sieve200.specLow]))/2 : 0;
    const v20=100-p8, v21=p8-p200, v22=p200;
    const denom=(g1!==0?v20/g1:0)+(g2!==0?v21/g2:0)+(g3!==0?v22/g3:0);
    const val = denom!==0 ? 100/denom : 0;
    S.gsbDesign = val ? val.toFixed(4) : "";
    gsbComputedDisplay.textContent = val ? val.toFixed(4) : "—";
  }
  gAggFields.forEach(f=>{ const inp=f.querySelector("input"); inp.addEventListener("input", refreshGsbDisplay); });
  refreshGsbDisplay();

  srcDesign.addEventListener("click", ()=>{
    S.gsbSource="design"; srcDesign.classList.add("selected"); srcDaily.classList.remove("selected");
    gsbComputedWrap.style.display="block"; gsbManualWrap.style.display="none";
    refreshGsbDisplay();
  });
  srcDaily.addEventListener("click", ()=>{
    S.gsbSource="daily"; srcDaily.classList.add("selected"); srcDesign.classList.remove("selected");
    gsbManualWrap.style.display="block"; gsbComputedWrap.style.display="none";
  });
  gsbSrcGroup.appendChild(srcDesign); gsbSrcGroup.appendChild(srcDaily);
  card.appendChild(gsbSrcGroup);
  const gsbPbaRow = el("div",{class:"grid design-gsb-pba-row"});
  gsbComputedWrap.classList.add("gsb-computed-wrap");
  gsbPbaRow.appendChild(gsbComputedWrap);
  gsbPbaRow.appendChild(makeField("pbaDesign","درصد جذب قیر در طرح (%)",{hint:"Pba — از طرح مشاور (برای Gse محاسباتی گزارش)"}));
  card.appendChild(gsbPbaRow);
  card.appendChild(gsbManualWrap);

  /* مرجع طرح (الزامی) برای کنترل اختلاف ±0.04 با گزارش (تب «تطبیق با معیارها» — accept.js).
     Gse طرح از Gmm طرح، Pb بهینه و Gac محاسبه می‌شود:  Gse = (100 - Pb) / (100/Gmm - Pb/Gac) */
  card.appendChild(sectionHead("مرجع طرح برای کنترل اختلاف با گزارش"));
  const gRef = el("div",{class:"grid cols-3 design-reference-grid"});
  [
    makeField("gmmDesign","Gmm طرح (رایس، در قیر بهینه)",{hint:"از جدول رایس طرح مشاور، در درصد قیر بهینه"}),
    makeField("gaggDesign","Gagg طرح (وزن مخصوص حقیقی مخلوط مصالح)",{hint:"از جدول وزن مخصوص مصالح طرح مشاور (همان Gsb مخلوط)"}),
    makeField("pbOptimum","درصد قیر بهینه طرح — Pb (%)",{hint:"برای محاسبه‌ی Gse طرح"}),
    makeField("gac","Gac (وزن مخصوص قیر)",{hint:"برای محاسبه‌ی Gse طرح"}),
  ].forEach(f=>gRef.appendChild(f));
  const gseBox = el("div",{class:"field"});
  gseBox.appendChild(el("label",{},"Gse طرح (محاسبه‌شده)"));
  const gseDisp = el("div",{style:"font-size:13.5px;font-weight:700;color:var(--blue);background:var(--blue-soft);border-radius:7px;padding:9px 12px;"},"—");
  gseBox.appendChild(gseDisp);
  gseBox.appendChild(el("div",{class:"hint",style:"font-size:11px;color:var(--ink-soft);margin-top:3px;"},"= (100 − Pb) / (100/Gmm − Pb/Gac)"));
  gRef.appendChild(gseBox);
  card.appendChild(gRef);
  function refreshGseDesign(){
    const v = (typeof gseDesignValue === "function") ? gseDesignValue() : null;     // accept.js
    gseDisp.textContent = v === null ? "— (پس از تکمیل فیلدهای کنارش)" : v.toFixed(3);
  }
  card.addEventListener("input", refreshGseDesign);
  card.addEventListener("change", refreshGseDesign);
  refreshGseDesign();
  card.appendChild(el("div",{style:"margin-top:4px;font-size:11px;color:var(--ink-soft);line-height:1.9;"},"Gagg همان وزن مخصوص حقیقی (Gsb) مخلوط مصالح است — نه Gse. اختلاف مجاز Gmm / Gse / Gagg بین طرح و گزارش پیش‌فرض ±0.04 است (در تب «تطبیق با معیارها» لیست می‌شود؛ حدش در پنل «محدوده‌ی پذیرش» تب‌های وزن مخصوص و دانه‌بندی قابل تغییر است)."));

  card.appendChild(el("div",{style:"margin-top:6px;font-size:11px;color:var(--ink-soft);"},"نکته: انتخاب روش نمونه (با موم / بدون موم) به تب «مارشال» منتقل شده است."));

  const saveBar = el("div",{class:"export-bar",style:"justify-content:flex-start;margin-top:20px;padding-top:16px;border-top:1px dashed var(--line);"});
  const btnSave = el("button",{class:"btn-ghost"},"ذخیره طرح (JSON)");
  const btnLoad = el("button",{class:"btn-ghost"},"بارگذاری طرح (JSON)");
  const loadFileInput = el("input",{type:"file",accept:"application/json",style:"display:none;"});
  const saveMsg = el("span",{style:"font-size:11.5px;color:var(--ink-soft);align-self:center;"},"");

  btnSave.addEventListener("click", ()=>{
    /* مسیر و نام فایل را کاربر در پنجره‌ی «ذخیره‌ی با نام» انتخاب می‌کند (design-io.js) */
    saveDesignToFile().then(res => {
      if(res.cancelled){
        saveMsg.textContent = "ذخیره لغو شد.";
        saveMsg.style.color = "var(--err)";
        return;
      }
      saveMsg.textContent = res.picked ? "طرح ذخیره شد: " + res.name : "طرح در پوشه‌ی دانلود مرورگر ذخیره شد (این مرورگر انتخاب مسیر را پشتیبانی نمی‌کند).";
      saveMsg.style.color = "var(--ok)";
    });
  });

  btnLoad.addEventListener("click", ()=>{
    loadFileInput.value = "";
    loadFileInput.click();
  });

  loadFileInput.addEventListener("change", ()=>{
    if(loadFileInput.files && loadFileInput.files[0]){
      loadDesignFromFile(loadFileInput.files[0], (ok)=>{
        if(ok){
          renderApp();
          showToast("طرح «" + (S.designName || "") + "» بارگذاری شد");
        } else {
          saveMsg.textContent = "فایل معتبر نیست.";
          saveMsg.style.color = "var(--err)";
        }
      });
    }
  });

  saveBar.appendChild(btnSave);
  saveBar.appendChild(btnLoad);
  saveBar.appendChild(loadFileInput);
  saveBar.appendChild(saveMsg);
  card.appendChild(saveBar);
}
</script>

<script>
/* ===================== REPORT (final step) ===================== */
function td(cls, text){ return el("td",{class:cls}, text); }
/* مقدار چپ‌به‌راست و ایزوله (تاریخ، ساعت، عدد+واحد) تا در متن راست‌چین جابه‌جا/برعکس نشود (مثل «C° 25»).
   calt خاموش است چون فونت Vazirmatn جای «/» بین ارقام را بسته به بافت عوض می‌کند و html2canvas
   متن را تکه‌تکه می‌کشد؛ نتیجه‌اش روی‌هم‌افتادن اسلش با رقم بود (1405/05/28 ← 140‌505/28). */
function ltr(text){ return el("span",{dir:"ltr",style:"display:inline-block;unicode-bidi:isolate;font-feature-settings:'calt' 0;"}, text); }

function buildGradationSVG(r){
  const W=700, H=330, padL=54, padR=16, padT=36, padB=28;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const cfg = getAsphaltSieveConfig();
  const xmax = isAsphaltSize()==="25" ? 40 : 25.6;
  const xmin=0.05;
  const xTicks=[0.05,0.1,0.2,0.4,0.8,1.6,3.2,6.4,12.8,25.6].filter(x=>x<xmax);
  xTicks.push(xmax);
  const xPix = mm => padL + (Math.log10(mm)-Math.log10(xmin))/(Math.log10(xmax)-Math.log10(xmin))*plotW;
  const yPix = pct => padT + (100-pct)/100*plotH;
  const sizes = cfg.map(x=>x.mm);
  const sieveLabels = cfg.map(x=>x.label);
  const measured = cfg.map(x=>r.passing.bySieve[x.ret] ?? 0);
  const upper = cfg.map(x=>num(S[x.specUp]));
  const lower = cfg.map(x=>num(S[x.specLow]));
  const ptStr = arr => sizes.map((mm,i)=> xPix(mm)+","+yPix(arr[i])).join(" ");

  let grid="";
  xTicks.forEach(t=>{
    const x=xPix(t);
    grid += `<line x1="${x}" y1="${padT}" x2="${x}" y2="${padT+plotH}" stroke="#e3e1db" stroke-width="1"/>`;
    grid += `<text x="${x}" y="${H-8}" font-size="9" text-anchor="middle" fill="#5b5f66">${t}</text>`;
  });
  for(let p=0;p<=100;p+=20){
    const y=yPix(p);
    grid += `<line x1="${padL}" y1="${y}" x2="${padL+plotW}" y2="${y}" stroke="#e3e1db" stroke-width="1"/>`;
    grid += `<text x="${padL-8}" y="${y+3}" font-size="9" text-anchor="end" fill="#5b5f66">${p}</text>`;
  }
  let topAxis = `<line x1="${padL}" y1="${padT}" x2="${padL+plotW}" y2="${padT}" stroke="#5b5f66" stroke-width="1"/>`;
  sizes.forEach((mm,i)=>{
    const x=xPix(mm);
    topAxis += `<line x1="${x}" y1="${padT}" x2="${x}" y2="${padT-5}" stroke="#5b5f66" stroke-width="1"/>`;
    topAxis += `<text x="${x}" y="${padT-9}" font-size="9" text-anchor="middle" fill="#2b2e33" font-weight="700">${sieveLabels[i]}</text>`;
  });
  topAxis += `<text x="${padL+plotW/2}" y="10" font-size="9" text-anchor="middle" fill="#5b5f66">شماره الک</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">
    ${grid}${topAxis}
    <polyline points="${ptStr(upper)}" fill="none" stroke="#a86a2e" stroke-width="1.6"/>
    <polyline points="${ptStr(lower)}" fill="none" stroke="#a86a2e" stroke-width="1.6"/>
    <polyline points="${ptStr(measured)}" fill="none" stroke="#232323" stroke-width="1.8" stroke-dasharray="5,3"/>
    ${sizes.map((mm,i)=>{
      const cx=xPix(mm), cy=yPix(measured[i]);
      const labelAbove = measured[i] < 93;
      const ty = labelAbove ? cy-7 : cy+14;
      return `<circle cx="${cx}" cy="${cy}" r="2.6" fill="#2f5d82"/><text x="${cx}" y="${ty}" font-size="9" text-anchor="middle" fill="#183c57" font-weight="700">${Number(measured[i]).toFixed(1)}</text>`;
    }).join("")}
    <rect x="${padL}" y="${padT}" width="${plotW}" height="${plotH}" fill="none" stroke="#b9b7b0"/>
    <text x="13" y="${padT+plotH/2}" transform="rotate(-90 13 ${padT+plotH/2})" font-size="10" font-weight="700" text-anchor="middle" fill="#2b2e33">درصد رد شده</text>
    <text x="${padL+plotW/2}" y="${H-1}" font-size="9" text-anchor="middle" fill="#5b5f66">اندازه سایز (mm)</text>
  </svg>`;
}

function buildReportSheet(r){
  const wrap = el("div",{id:"reportSheet"});
  const qcBrand = (typeof getQcBranding === "function") ? getQcBranding() : { companyName: "", logoDataUrl: "" };
  const reportTitle = el("h3",{});
  reportTitle.innerHTML = 'گزارش آزمایش طرح اختلاط آسفالت <span dir="rtl" style="direction:rtl;unicode-bidi:isolate;display:inline-block;">(بیندر/توپکا)</span>';
  if (qcBrand.companyName) {
    reportTitle.appendChild(document.createTextNode(" "));
    const qcSpan = el("span", { dir: "rtl", style: "direction:rtl;unicode-bidi:isolate;display:inline-block;" }, qcBrand.companyName);
    reportTitle.appendChild(qcSpan);
  }

function fixParensForExport(doc, root){
  const showText=doc.defaultView?.NodeFilter?.SHOW_TEXT ?? NodeFilter.SHOW_TEXT;
  const walker=doc.createTreeWalker(root,showText,null);
  const nodes=[];
  while(walker.nextNode()){
    if(/[()]/.test(walker.currentNode.nodeValue)) nodes.push(walker.currentNode);
  }
  nodes.forEach(node=>{
    const txt=node.nodeValue, idxs=[];
    for(let i=0;i<txt.length;i++) if(txt[i]==="("||txt[i]===")") idxs.push(i);
    const leftOf=(i)=>{
      const range=doc.createRange();
      range.setStart(node,i); range.setEnd(node,i+1);
      const rect=range.getBoundingClientRect();
      return rect.width?rect.left:null;
    };
    const glyph={}, stack=[];
    idxs.forEach(i=>{
      if(txt[i]==="(") stack.push(i);
      else if(stack.length){
        const open=stack.pop(), xOpen=leftOf(open), xClose=leftOf(i);
        if(xOpen!==null&&xClose!==null){
          glyph[open]=xOpen<=xClose?"(":")";
          glyph[i]=xOpen<=xClose?")":"(";
        }
      }
    });
    idxs.forEach(i=>{if(!(i in glyph)) glyph[i]=txt[i]==="("?")":"(";});
    const frag=doc.createDocumentFragment();
    let last=0;
    idxs.forEach(i=>{
      if(i>last) frag.appendChild(doc.createTextNode(txt.slice(last,i)));
      const span=doc.createElement("span");
      span.textContent=glyph[i];
      span.style.cssText="display:inline-block;direction:ltr;unicode-bidi:isolate;";
      frag.appendChild(span);
      last=i+1;
    });
    if(last<txt.length) frag.appendChild(doc.createTextNode(txt.slice(last)));
    node.parentNode.replaceChild(frag,node);
  });
}

<script>
/* ===================== تب «تطبیق با معیارها» (قبل از گزارش نهایی) =====================
   همه‌ی عدم‌تطابق‌ها یک‌جا: خارج از محدوده‌ی پذیرش + اختلاف طرح/گزارش (Gse، Gagg و Gmm رایس با طرح).
   فقط گزارش می‌دهد؛ چیزی را مسدود نمی‌کند. ارزیابی از accept.js (acceptEvaluateAll) می‌آید.
   داخل تب‌های ورودی دیگر هیچ پیام عدم تطابقی نشان داده نمی‌شود. */
const CF_TAB_STEP = {project:4, sg:5, bitumen:6, gradation:7, marshall:8};

function _cfLimits(ev){
  const L = ev.L, d = ev.d, f = v => _accVal(d, v) + (d.unit ? " " + d.unit : "");
  if(L.min !== null && L.max !== null) return d.signed ? "از " + f(L.min) + " تا " + f(L.max) : f(L.min) + " تا " + f(L.max);
  if(L.min !== null) return "حداقل " + f(L.min);
  if(L.max !== null) return "حداکثر " + f(L.max);
  return "—";
}

function renderStepConflicts(card){
  card.appendChild(el("h2",{},[el("span",{class:"num"},"10"),"تطبیق با معیارها"]));
  card.appendChild(el("div",{class:"desc"},"موارد خارج از محدوده‌ی پذیرش، و در پایان اختلاف بیش از حد مجاز (0.04) طرح با گزارش. این تب فقط گزارش می‌دهد؛ جلوی ثبت یا رفتن به گزارش نهایی را نمی‌گیرد و به برگه‌ی گزارش نهایی ربطی ندارد."));

  const evs = acceptEvaluateAll();
  const accEvs = evs.filter(ev => !ev.d.dev), devEvs = evs.filter(ev => ev.d.dev);
  const bad = [];
  accEvs.forEach(ev => ev.bad.forEach(b => bad.push({tab:ev.tab, text:b.text})));
  const devBad = [];
  devEvs.forEach(ev => ev.bad.forEach(b => devBad.push(b.text)));
  const total = bad.length + devBad.length;
  let naCount = 0;
  accEvs.forEach(ev => { if(ev.items.length && ev.state === "na") naCount++; });

  card.appendChild(el("div",{class:"cf-summary " + (total ? "cf-bad" : "cf-ok")},
    total ? "⚠ " + total + " مورد عدم تطابق پیدا شد" : "✓ هیچ عدم تطابقی پیدا نشد" + (naCount ? " (" + naCount + " کنترل هنوز به‌خاطر ناقص بودن داده قابل محاسبه نیست)" : "")));

  /* ۱) لیست تناقض‌های محدوده‌ی پذیرش، به تفکیک تب */
  if(bad.length){
    card.appendChild(el("div",{class:"cf-h"},"خارج از محدوده‌ی پذیرش"));
    Object.keys(CF_TAB_STEP).forEach(tab=>{
      const items = bad.filter(b => b.tab === tab);
      if(!items.length) return;
      const step = CF_TAB_STEP[tab];
      const grp = el("div",{class:"cf-group"});
      const go = el("button",{type:"button",class:"cf-go"},"رفتن به تب");
      go.addEventListener("click", ()=>{ currentStep = step; renderApp(); window.scrollTo({top:0,behavior:"smooth"}); });
      grp.appendChild(el("div",{class:"cf-group-title"},[STEP_TITLES[step], go]));
      items.forEach(b => grp.appendChild(el("div",{class:"cf-item"}, b.text)));
      card.appendChild(grp);
    });
  }

  /* ۲) وضعیت کنترل‌های محدوده‌ی پذیرش */
  card.appendChild(el("div",{class:"cf-h"},"وضعیت کنترل‌های محدوده‌ی پذیرش"));
  const tbl = el("table",{class:"cf-tbl"});
  tbl.appendChild(el("tr",{},["تب","پارامتر","مقدار","محدوده","وضعیت"].map(h => el("th",{},h))));
  accEvs.forEach(ev=>{
    const d = ev.d, lim = _cfLimits(ev), tabName = STEP_TITLES[CF_TAB_STEP[ev.tab]];
    ev.items.forEach(it=>{
      const val = it.v === null ? "—" : _accVal(d, it.v) + (d.unit ? " " + d.unit : "");
      const st = it.state === "bad" ? "⚠ عدم تطابق" : (it.state === "ok" ? "✓ مطابق" : "محاسبه نشده");
      tbl.appendChild(el("tr",{class: it.state === "bad" ? "cf-row-bad" : (it.state === "ok" ? "cf-row-ok" : "")},[
        el("td",{}, tabName), el("td",{class:"cf-name"}, it.name || d.label),
        el("td",{class: it.v === null ? "cf-na" : ""}, val), el("td",{}, lim), el("td",{class:"cf-st" + (it.state === "na" ? " cf-na" : "")}, st)]));
    });
  });
  card.appendChild(el("div",{class:"cf-tblwrap"},[tbl]));
  card.appendChild(el("div",{style:"margin-top:10px;font-size:11.5px;color:var(--ink-soft);line-height:1.9;"},
    "محدوده‌ها را در پنل «محدوده‌ی پذیرش» بالای هر تب تغییر بده. الک‌ها (دانه‌بندی)، بنزین مصرفی، استحکام و نرمی بررسی پذیرش ندارند. «محاسبه نشده» یعنی داده‌ی لازم هنوز وارد نشده."));

  /* ۳) مقادیر طرح و گزارش زیر هم (Gmm محاسباتی فقط در برگه گزارش نهایی نمایش داده می‌شود) */
  const r = calculate(S);
  const rice = _accN("gmm");
  const gmm3 = _accN("gmmDesign"), gagg3 = _accN("gaggDesign");
  const gse1 = rice !== null ? _gseReport(r) : null, gse3 = gseDesignValue();
  const gagg1 = _gaggReport(r);
  const f3 = v => v === null ? "—" : Number(v).toFixed(3);
  const rows = [];
  if(rice !== null){
    rows.push(["Gmm رایس — اندازه‌گیری‌شده روی نمونه", f3(rice)]);
    rows.push(["Gmm طرح — رایس در قیر بهینه", f3(gmm3)]);
    rows.push(["Gse گزارش (از Gmm رایس و Pb نمونه)", f3(gse1)]);
    rows.push(["Gse طرح (از Gmm طرح و Pb بهینه)", f3(gse3)]);
  }
  rows.push(["Gagg گزارش (وزن مخصوص حقیقی مصالح همان روز)", f3(gagg1)]);
  rows.push(["Gagg طرح", f3(gagg3)]);
  card.appendChild(el("div",{class:"cf-h"},"مقادیر طرح و گزارش (برای مقایسه‌ی چشمی)"));
  const vt = el("table",{class:"cf-tbl cf-vals"});
  rows.forEach(rw => vt.appendChild(el("tr",{},[el("td",{class:"cf-name"}, rw[0]), el("td",{}, rw[1])])));
  card.appendChild(el("div",{class:"cf-tblwrap"},[vt]));
  card.appendChild(el("div",{style:"font-size:11.5px;color:var(--ink-soft);line-height:1.9;margin-top:8px;"},[
    "Gse گزارش و طرح با فرمول یکسان محاسبه می‌شوند؛ تفاوت فقط در ورودی‌هاست:",
    el("div",{dir:"ltr",style:"text-align:left;font-family:monospace;"},"Gse  = (100 - Pb) / (100/Gmm - Pb/Gac)")]));

  /* ۴) بندهای آخر: فقط اگر اختلاف بیش از 0.04 بود (اگر نبود، هیچ اعلامی نمی‌آید) */
  if(devBad.length){
    card.appendChild(el("div",{class:"cf-h"},"اختلاف طرح با گزارش بیش از حد مجاز (0.04)"));
    devBad.forEach(t => card.appendChild(el("div",{class:"cf-item"}, t)));
  }
}

function markImportMissingFields(card){
  if(!technicianImportActive || !card || !card.querySelectorAll) return;
  const fields = Array.from(card.querySelectorAll(".field, td.fcell"));
  fields.forEach(host=>{
    const key = host._key;
    if(!key) return;
    if(reviewSkipped(key)){ host.classList.remove("import-missing"); return; }
    if(PROJECT_EMPTY_HIGHLIGHT_KEYS.indexOf(key) !== -1){ host.classList.remove("import-missing"); return; }
    const sp = fieldSpec(key);
    if(sp.optional || sp.virtual || (sp.activeIf && !sp.activeIf())) { host.classList.remove("import-missing"); return; }
    const raw = S[key];
    if(hasVal(raw) && String(raw).trim() !== "") { host.classList.remove("import-missing"); return; }
    const sg = sampleGroupOf(key);
    if(sg){
      const complete = sg.set.some(g=>g.every(_isFilled));
      if(complete){ host.classList.remove("import-missing"); return; }
      const partial = sg.set.some(g=>g.some(_isFilled) && !g.every(_isFilled));
      if(!partial && sg.set.indexOf(sg.grp)!==0){ host.classList.remove("import-missing"); return; }
      if(partial && !sg.grp.some(_isFilled)){ host.classList.remove("import-missing"); return; }
    }
    host.classList.add("import-missing");
  });
}

        const lightBtn=el("button",{type:"button",id:"themeLight", "aria-pressed":String(getColorTheme()==="light")},"روشن");
        const darkBtn=el("button",{type:"button",id:"themeDark", "aria-pressed":String(getColorTheme()==="dark")},"تیره");
        const group=el("div",{class:"theme-switch",role:"group","aria-label":"انتخاب تم رنگی"},[lightBtn,darkBtn]);
        lightBtn.addEventListener("click",()=>setColorTheme("light",lightBtn,darkBtn));
        darkBtn.addEventListener("click",()=>setColorTheme("dark",lightBtn,darkBtn));
        return group;
      })(),
      el("div",{class:"badge"}, "مرحله "+(currentStep+1)+" از "+STEP_TITLES.length)
    ])
  ]));
  setColorTheme(getColorTheme());

  const stepper = el("div",{class:"stepper"});
  let activePill = null;
  STEP_TITLES.forEach((t,i)=>{
    const cls = i===currentStep
  ? "step-pill active" + (i===1?" personalize-tab":"")
  : (i<currentStep ? "step-pill done" : "step-pill" + (i===1?" personalize-tab":""));

    const pill = el("div",{class:cls}, t);
    if(i===currentStep) activePill = pill;
    pill.addEventListener("click", ()=>{
      if(i===currentStep) return;
      
      if(i<currentStep){
        if(i===2&&S.rawSaveRequested&&!S.rawSaved){S.rawSaveRequested=false;S.reportSerial="";}
        currentStep=i; renderApp(); window.scrollTo({top:0,behavior:"smooth"}); return;
      }
      const blockedAt = firstInvalidStepBefore(i);
      if(blockedAt===-1){
        currentStep=i; renderApp(); window.scrollTo({top:0,behavior:"smooth"});
      } else {
        currentStep=blockedAt; renderApp();
        const cardEl = document.querySelector(".card");
        if(cardEl) validateStep(cardEl);
        showToast("برای ادامه، فیلدهای قرمز را تکمیل یا اصلاح کنید", "err");
        const bad = document.querySelector(".field.invalid, td.invalid");
        if(bad) bad.scrollIntoView({behavior:"smooth", block:"center"});
        else window.scrollTo({top:0,behavior:"smooth"});
      }
    });
    stepper.appendChild(pill);
  });
  appSidebar.appendChild(stepper);
  if(activePill && window.matchMedia("(max-width: 900px)").matches){
    requestAnimationFrame(()=>activePill.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"}));
  }

  const card = el("div",{class: (currentStep>=4 && currentStep<=10) ? "card card-daily" : "card"});

  STEP_RENDERERS[currentStep](card);
  if(technicianImportActive) markImportMissingFields(card);
  appMain.appendChild(card);

  appMain.appendChild(el("footer",{class:"foot"}, "برای رفتن به هر مرحله، روی عنوان همان تب در سمت راست صفحه کلیک کنید. این ابزار بدون نیاز به سرور یا اینترنت، به‌صورت کاملاً محلی روی سیستم شما اجرا می‌شود."));
  appMain.appendChild(el("div",{class:"app-credit"}, "طراحی توسط آکادمی آموزشی لیان"));

  app.appendChild(appSidebar);
  app.appendChild(appMain);
}


/* بررسی می‌کند آیا همه‌ی مراحل قبل از targetStep فیلدهای الزامی‌شان پر است؛
   در صورت ناقص بودن، شماره‌ی اولین مرحله‌ی ناقص را برمی‌گرداند، وگرنه -1 */
function firstInvalidStepBefore(targetStep){
  // تب‌های «طراحی این وب-اپ»(0) و «شخصی‌سازی»(1) اطلاعاتی وارد/محاسبه نمی‌شوند،
  // پس ورود به خودشان بدون اعتبارسنجی مجاز است. اما از تب «شروع»(2) به بعد،
  // یعنی همان انتخاب طرح جدید/بارگذاری‌شده، باید پیش از رفتن به «طرح اختلاط»(3)
  // و مراحل بعدی، تکمیل شده باشد.
  if(targetStep <= 1){
    return -1;
  }

  for(let k=2;k<targetStep;k++){
    const temp = document.createElement("div");
    STEP_RENDERERS[k](temp);
    if(!validateStep(temp)) return k;
  }
  return -1;
}


/* کلید Enter داخل فیلدهای متنی/عددی، دقیقا مثل Tab، فوکوس را به فیلد بعدی
   می‌برد (به‌جز textarea که Enter در آن باید خط جدید بسازد، و به‌جز
   چک‌باکس/رادیو/فایل که رفتار پیش‌فرض خودشان حفظ می‌شود). چون این listener
   روی document نصب می‌شود، نیازی به نصب دوباره پس از هر renderApp نیست. */
function setupEnterAsTabNav(){
  document.addEventListener("keydown", (e)=>{
    if(e.key !== "Enter") return;
    const t = e.target;
    if(!t || t.tagName !== "INPUT") return;
    if(["checkbox","radio","file","button"].indexOf(t.type) !== -1) return;
    e.preventDefault();
    // خطای مشخص در ورودی: اجازه‌ی عبور از این باکس داده نمی‌شود
    const hostEl = t.closest(".field, td.fcell");
    if(hostEl && hostEl.classList.contains("invalid") && t.value.trim() !== "") return;
    // خطای ترتیب (تاریخ/وزن‌ها): همان لحظه‌ی Enter نشان بده و جلو نرو
    if(hostEl && hostEl._key && CROSS_KEYS[hostEl._key] && t.value.trim() !== ""){
      const ce = crossError(hostEl._key);
      if(ce){ showFieldError(hostEl, ce); hostEl.classList.add("cross-invalid"); return; }
    }
    
    // اگر در جدول وزن مخصوص هستیم، ناوبری ستونی
    const table = t.closest("table.sample-table");
    if(table && t.dataset.sample){
      const currentSample = t.dataset.sample;
      const allInputs = Array.from(table.querySelectorAll("input[data-sample]"));
      const sampleInputs = allInputs.filter(inp => inp.dataset.sample === currentSample);
      const idx = sampleInputs.indexOf(t);
      
      if(idx > -1 && idx < sampleInputs.length - 1){
        // رفتن به ورودی بعدی در همان ستون
        sampleInputs[idx + 1].focus();
        sampleInputs[idx + 1].select();
      } else if(idx === sampleInputs.length - 1){
        // آخرین ورودی ستون، رفتن به اولین ورودی ستون بعدی
        const nextSample = String(Number(currentSample) + 1);
        const nextColInputs = allInputs.filter(inp => inp.dataset.sample === nextSample);
        if(nextColInputs.length > 0){
          nextColInputs[0].focus();
          nextColInputs[0].select();
        } else {
          // اگر ستون بعدی نیست، خارج از جدول
          const focusable = Array.from(document.querySelectorAll("#app input, #app textarea, #app select"))
            .filter(elm => !elm.disabled && elm.offsetParent !== null);
          const tableLastIdx = focusable.indexOf(t);
          if(tableLastIdx > -1 && tableLastIdx < focusable.length - 1){
            focusable[tableLastIdx + 1].focus();
            if(typeof focusable[tableLastIdx + 1].select === "function"){
              focusable[tableLastIdx + 1].select();
            }
          }
        }
      }
      return;
    }
    
    // برای بقیه ورودی‌ها، ناوبری عادی
    const focusable = Array.from(document.querySelectorAll("#app input, #app textarea, #app select"))
      .filter(elm => !elm.disabled && elm.offsetParent !== null);
    const idx = focusable.indexOf(t);
    if(idx > -1 && idx < focusable.length - 1){
      const nextEl = focusable[idx+1];
      nextEl.focus();
      if(typeof nextEl.select === "function") nextEl.select();
    }
  });
}



document.addEventListener("DOMContentLoaded", ()=>{
  setupEnterAsTabNav();
  renderApp();
});
</script>
